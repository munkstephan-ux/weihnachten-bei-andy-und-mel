<!doctype html>
<html lang="de">
<head>
<base href="../">
<meta name="robots" content="noindex">
<title>Heiligabend bei Andy, Mel & Connor</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3326">
<meta name="description" content="Raclette & Fondue an Heiligabend bei Andy, Mel & Connor: wer dabei ist, wer was mitbringt, Wünsche und Rezepte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weihnachten">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Aufbau: Kopf wie eine Einladungskarte (Tannengrün, Goldrahmen), darunter drei Bereiche über eine Leiste unten:
   „Der Abend“ (Begrüßung, dein Beitrag, wo noch Hilfe willkommen ist, Gastgeber-Bereich), „Mitbringen“ (Kategorien), „Gäste“.
   Einträge und Gäste öffnen ein Blatt von unten. Beim ersten Öffnen führt ein Willkommens-Blatt durch drei Schritte. */
:root{
  --bg:#f6efe2; --paper:#fffaf1; --sunk:#f0e6d4; --ink:#1c2520; --muted:#6a6150; --line:#e5d7be; --line2:#d9c7a6;
  --fir:#0c3326; --fir-deep:#05190f; --on-fir:#f8f1e1; --on-fir-muted:#cdbf9c;
  --gold:#9f7a2c; --gold-2:#d9b867; --gold-soft:#f5ead0; --cran:#9b2335; --cran-soft:#f7e3e5;
  --ok:#2e6c46; --ok-soft:#e2eee5; --shadow:0 1px 0 rgba(120,90,40,.06),0 14px 30px -22px rgba(60,35,10,.45);
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --script:"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1410; --paper:#111f18; --sunk:#172a20; --ink:#f2ebdc; --muted:#ada38c; --line:#233a2e; --line2:#2f4a3b;
  --gold:#dcbd6e; --gold-2:#e9cf8a; --gold-soft:#262113; --cran:#e7798a; --cran-soft:#3a1c22;
  --ok:#83d0a0; --ok-soft:#163327; --shadow:0 1px 0 rgba(0,0,0,.2),0 16px 30px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1410; --paper:#111f18; --sunk:#172a20; --ink:#f2ebdc; --muted:#ada38c; --line:#233a2e; --line2:#2f4a3b;
  --gold:#dcbd6e; --gold-2:#e9cf8a; --gold-soft:#262113; --cran:#e7798a; --cran-soft:#3a1c22;
  --ok:#83d0a0; --ok-soft:#163327; --shadow:0 1px 0 rgba(0,0,0,.2),0 16px 30px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(159,122,44,.07) 1px,transparent 1.4px);background-size:26px 26px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---- Vorschau-Hinweis ---- */
.demo{position:sticky;top:0;z-index:30;background:var(--gold-2);color:#2a2008;font-size:13px;font-weight:600;text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}

/* ---- Kopf: Einladungskarte ---- */
.hero{position:relative;overflow:hidden;color:var(--on-fir);background:radial-gradient(130% 100% at 50% 0%,#14513b 0%,var(--fir) 45%,var(--fir-deep) 100%);padding:calc(30px + env(safe-area-inset-top,0px)) 0 34px}
.demo~.hero{padding-top:30px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:2}
.card-frame{position:relative;border:1px solid rgba(217,184,103,.55);border-radius:20px;padding:40px 20px 34px;text-align:center;
  box-shadow:inset 0 0 0 5px rgba(12,51,38,.0),inset 0 0 0 6px rgba(217,184,103,.22)}
.orn{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold-2);z-index:1}
.orn.top{top:12px}.orn.bot{bottom:10px}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold-2)}
.hero h1{font-size:clamp(34px,9vw,50px);line-height:1.02;margin:10px 0 8px;font-weight:600;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero h1 em{font-style:italic;font-weight:500;color:var(--gold-2)}
.menu{font-family:var(--display);font-style:italic;font-size:21px;color:#ecdcb2}
.facts{display:flex;justify-content:center;gap:0;margin-top:20px;border-top:1px solid rgba(217,184,103,.28);padding-top:16px}
.fact{flex:1;min-width:0;display:grid;gap:2px;padding:0 6px}
.fact+.fact{border-left:1px solid rgba(217,184,103,.22)}
.fact b{font-family:var(--display);font-weight:600;font-size:27px;line-height:1;color:#f3d888;font-variant-numeric:lining-nums tabular-nums}
.fact span{font-size:12px;color:var(--on-fir-muted);line-height:1.3}
.lights{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:34px;z-index:1;display:flex;justify-content:space-around;pointer-events:none;opacity:.85}
.demo~.hero .lights{top:0}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:-16px;height:24px;border-bottom:1px solid rgba(0,0,0,.5);border-radius:0 0 50% 50%/0 0 100% 100%}
.bulb{position:relative;width:7px;height:11px;margin-top:6px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:radial-gradient(circle at 40% 35%,#fff 0 18%,var(--c) 50%);box-shadow:0 0 5px 1px var(--c),0 0 16px 4px var(--g)}
.bulb:nth-child(odd){margin-top:10px}
.bulb:nth-child(4n+1){--c:#ffcf6b;--g:rgba(255,207,107,.35)}.bulb:nth-child(4n+2){--c:#ff6b78;--g:rgba(255,107,120,.3)}.bulb:nth-child(4n+3){--c:#ffe3a3;--g:rgba(255,227,163,.35)}.bulb:nth-child(4n){--c:#8fe0b0;--g:rgba(143,224,176,.28)}
@media (prefers-reduced-motion:no-preference){.bulb{animation:tw 3s ease-in-out infinite}.bulb:nth-child(3n){animation-delay:-1s}.bulb:nth-child(3n+1){animation-delay:-2s}
  @keyframes tw{50%{opacity:.65}}}
.hero.small{padding:calc(18px + env(safe-area-inset-top,0px)) 0 22px}
.demo~.hero.small{padding-top:18px}
.hero.small .card-frame{padding:18px 16px 16px}
.hero.small .orn{display:none}
.hero.small h1{font-size:clamp(26px,7vw,34px);margin:6px 0 2px}
.hero.small .facts,.hero.small .menu{display:none}

/* ---- Inhalt ---- */
main{padding:22px 0 calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px));display:grid;gap:26px}
.status{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--sunk);color:var(--muted)}
.status[data-kind="warn"]{background:var(--cran-soft);color:var(--ink)}
.sec{display:grid;gap:12px}
.sec-h{display:grid;gap:2px}
.sec-h .k{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.sec-h h2{font-size:27px;line-height:1.1}
.sec-h p{color:var(--muted);font-size:14.5px;max-width:52ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}

/* Begrüßung */
.welcome{position:relative;padding:22px 20px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.welcome h2{font-size:30px;line-height:1.08}
.welcome p{color:var(--ink);max-width:44ch;font-size:15.5px}
.welcome .note{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:14.5px;max-width:44ch}
.welcome .note b{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.welcome .sign{font-family:var(--script);font-size:34px;max-width:none;white-space:nowrap;line-height:1.1;color:var(--gold);margin-top:2px}
.welcome .eyebrow{font-size:11.5px;color:var(--gold)}
.mystatus{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--fir);background:var(--fir);color:var(--on-fir);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;transition:transform .12s,background .15s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--gold-2);border-color:var(--gold-2);color:#1d1606}}
:root[data-theme="dark"] .btn{background:var(--gold-2);border-color:var(--gold-2);color:#1d1606}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold-2);border-color:var(--gold-2);color:#2a2008}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.small{padding:7px 13px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:4px 2px;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* Zeilen */
.rows{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:grid;gap:2px;text-align:left;background:none;border:0;padding:4px 0;color:inherit}
.row .t{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.row .s .ico{width:14px;height:14px;vertical-align:-2px}
.row .s span{display:inline-flex;gap:4px;align-items:center}
.catlbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:transparent;color:var(--muted);line-height:1.2}
.chip .ico{width:15px;height:15px}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok);max-width:48%}
.chip.ok .nm{overflow:hidden;text-overflow:ellipsis}
.chip.me{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.chip.take{border:1px solid var(--gold);color:var(--gold);background:transparent}
.chip.take:hover{background:var(--gold-soft)}
.chip.like[aria-pressed="true"]{border-color:transparent;background:var(--cran-soft);color:var(--cran)}
.chip.st-ja{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.st-offen{border-style:dashed;color:var(--gold);border-color:var(--gold)}
.chip.st-nein{color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:14.5px;text-align:center}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:none;opacity:1}}

/* Fortschritt */
.progress{display:grid;gap:8px;padding:16px 18px}
.progress .bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .6s ease}
.progress .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.progress .lbl span:last-child{white-space:nowrap;font-weight:600;color:var(--gold)}
.progress .lbl b{color:var(--ink);font-weight:600}

/* Kategorien */
.cat-h{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 6px}
.cat-h .em{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.cat-h .em .ico{width:22px;height:22px}
.cat-h h3{font-size:24px;line-height:1.1}
.cat-h .sub{font-size:13px;color:var(--muted)}
.cat-intro{padding:2px 18px 12px;color:var(--muted);font-size:14.5px;max-width:56ch}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px 14px;border-top:1px solid var(--line)}
.addform input[type=text]{flex:1 1 180px;min-width:0;border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:9px 14px}
.addform input[type=text]:focus{outline:none;border-color:var(--gold)}
.addform label{display:inline-flex;gap:7px;align-items:center;font-size:14px;color:var(--muted);white-space:nowrap}
.addform input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 14px}
.sugg span{font-size:12.5px;color:var(--muted)}
.sugg button{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:5px 11px;font-size:13.5px;color:var(--muted)}
.sugg button:hover{border-style:solid;color:var(--ink)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.jump a small{color:var(--gold);font-weight:700;margin-left:4px}


/* Gastgeber-Bereich */
.host{border:1px dashed var(--line2);border-radius:var(--r);background:transparent}
.host summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:10px;align-items:center;font-weight:600}
.host summary::-webkit-details-marker{display:none}
.host summary .ico{color:var(--gold)}
.host summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.host[open] summary::after{transform:rotate(225deg)}
.host .in{padding:0 18px 18px;display:grid;gap:18px}
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.inp{width:100%;min-width:0;border:1px solid var(--line2);background:var(--paper);border-radius:12px;padding:10px 12px}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{resize:vertical;line-height:1.5}
.amounts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.amounts b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.field>.hostsub{font-family:var(--display);font-size:21px;font-weight:600;margin-top:4px}

/* Leiste unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs nav{pointer-events:auto;max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:22px;
  background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 12px 30px -12px rgba(30,20,5,.35)}
.tabs button{position:relative;display:grid;justify-items:center;gap:2px;border:0;background:transparent;border-radius:16px;padding:7px 4px 6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button .ico{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--gold-soft)}
.tabs button[aria-current="page"] .ico{color:var(--gold)}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--cran);color:#fff;font-size:10.5px;line-height:17px;font-weight:700}

/* Blatt von unten */
dialog.sheet{border:0;padding:0;margin:0;max-width:none;width:100%;max-height:none;background:transparent;color:var(--ink)}
dialog.sheet::backdrop{background:rgba(5,15,10,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog.sheet[open]{position:fixed;inset:auto 0 0 0;display:flex;justify-content:center}
.sh:focus{outline:none}
.sh .stick{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:16px -20px 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 22%);z-index:2}
.sh{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sh::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
@media (min-width:700px){dialog.sheet[open]{inset:0;align-items:center}.sh{border-radius:24px;max-height:86vh}.sh::before{display:none}}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open] .sh{animation:up .32s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.sh .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.sh h2{font-size:28px;line-height:1.1;padding-right:40px}
.sh .lead{color:var(--muted);margin-top:4px;font-size:15px}
.sh .blk{display:grid;gap:10px;margin-top:20px}
.sh .blk>h4{margin:0;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.titleinp{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;border:1px solid transparent;background:transparent;border-radius:10px;padding:2px 6px;margin-left:-6px;width:calc(100% - 40px)}
.titleinp:hover{border-color:var(--line)}
.titleinp:focus{outline:none;border-color:var(--gold);background:var(--bg)}
.seg{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line2);background:var(--paper);border-radius:14px;padding:14px 16px;font-weight:600;font-size:16px;width:100%}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt .em{font-size:22px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;gap:8px;justify-items:center;text-align:center;border:1px solid var(--line2);background:var(--paper);border-radius:16px;padding:16px 10px;font-weight:600;font-size:15px;line-height:1.25}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;color:var(--on-fir);background:linear-gradient(145deg,#1b5c43,var(--fir))}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:24px;height:4px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);font-size:18px;line-height:1}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.thread{display:grid;gap:10px}
.msg{background:var(--sunk);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;position:relative}
.msg b{display:block;font-size:12.5px;color:var(--gold)}
.msg .x{position:absolute;top:4px;right:4px;border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:50%}
.msgform{display:flex;gap:8px}
.msgform input{flex:1;min-width:0}
.rztext{white-space:pre-wrap;font-size:15px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.likers{font-size:13.5px;color:var(--muted)}
.danger{color:var(--cran);border-color:transparent;background:transparent;font-weight:600;padding:10px 0;border:0}
.center{text-align:center}
.hint{font-size:13.5px;color:var(--muted)}
.howto{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.howto li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.howto li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14.5px;max-width:calc(100% - 32px);z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast button{background:transparent;border:0;color:var(--gold-2);font-weight:700}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{transform:translate(-50%,10px);opacity:0}}
  .view{animation:vin .28s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}}}
.guide{padding:18px;display:grid;gap:4px}
.guide h3{font-size:23px;line-height:1.15}
.guide>p{color:var(--muted);font-size:14px;margin-bottom:6px}
.gstep{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0;color:inherit}
.gstep .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-weight:700;font-size:15px;border:1.5px solid var(--gold);color:var(--gold)}
.gstep.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.gstep.done .n .ico{width:18px;height:18px;stroke-width:2.4}
.gstep b{display:block;font-size:15.5px}
.gstep small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.gstep.done b{color:var(--muted)}
.gstep .go{color:var(--gold);display:grid;place-items:center}
.gstep .go .ico{width:20px;height:20px;stroke-width:2}
.thanks{padding:22px 20px;text-align:center;display:grid;gap:8px;background:linear-gradient(160deg,var(--gold-soft),var(--paper))}
.thanks h2{font-size:28px}
.foot{text-align:center;display:grid;gap:4px;justify-items:center;padding-top:6px;color:var(--muted);font-size:13.5px}
.foot .tradition{font-family:var(--script);font-size:38px;line-height:1.05;color:var(--cran)}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Vorschau mit Beispieldaten · nichts wird gespeichert, keine Benachrichtigungen</div>
<header class="hero" id="hero">
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <div class="wrap">
    <div class="card-frame">
      <svg class="orn top" width="22" height="18" viewBox="0 0 24 20" aria-hidden="true"><path fill="currentColor" d="M12 0l2.4 6.6L21 7.6l-5.2 4 1.9 6.9L12 14.6l-5.7 3.9 1.9-6.9-5.2-4 6.6-1z"/></svg>
      <p class="eyebrow" id="h-eyebrow">Heiligabend</p>
      <h1>Bei Andy, Mel <em>&amp;</em> Connor</h1>
      <p class="menu">Raclette &amp; Fondue, wie jedes Jahr</p>
      <div class="facts">
        <div class="fact"><b id="f-days">–</b><span id="f-days-l">Tage bis Heiligabend</span></div>
        <div class="fact"><b id="f-when">–</b><span id="f-when-l">Uhr</span></div>
        <div class="fact"><b id="f-pers">–</b><span>sind dabei</span></div>
      </div>
      <svg class="orn bot" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><path d="M2 7h12M26 7h12" stroke="currentColor" stroke-width="1"/><circle cx="20" cy="7" r="3.2" fill="currentColor"/><circle cx="14.5" cy="7" r="1.3" fill="currentColor"/><circle cx="25.5" cy="7" r="1.3" fill="currentColor"/></svg>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="status" id="status" style="margin-top:18px">Einen Moment, die Liste wird geladen …</div>
  <main id="main" class="view"></main>
</div>

<div class="tabs"><nav id="tabs" aria-label="Bereiche"></nav></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sh" id="sh" tabindex="-1"></div></dialog>
<div id="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
/* ---------- Grundlagen ---------- */
const DEMO=new URLSearchParams(location.search).has('vorschau')||/\/vorschau\//.test(location.pathname);
const CFG=window.APP_CONFIG||{};
const ME_KEY=DEMO?'weihnachten-vorschau-ich':'weihnachten-ich-v2';
const STUMM=new URLSearchParams(location.search).has('stumm');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  sget(k){try{return sessionStorage.getItem(k)}catch(e){return null}},sset(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
function amount(t,u){if(u==='g')return t>=1000?fmt(Math.round(t/100)/10)+' kg':Math.round(t/50)*50+' g';if(u==='l')return fmt(Math.round(t*2)/2)+' l';return''}
const IC={
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  basket:'<path d="M3.5 10h17l-1.7 9.1a1.6 1.6 0 0 1-1.6 1.4H6.8a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M8 10l4-6 4 6M9.5 14v3M14.5 14v3"/>',
  people:'<circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c.8-3.6 3.2-5.6 6.4-5.6s5.6 2 6.4 5.6M15.8 4.8a3.2 3.2 0 0 1 0 6.2M17.8 14.6c1.9.7 3.1 2.6 3.6 5.4"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  chat:'<path d="M4.5 5.5h15v10h-8l-4.5 3.5v-3.5h-2.5z"/>',
  book:'<path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15h10"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  gift:'<path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13"/><path d="M12 7c-1.5-3-5-3.5-5-1.5S10 7 12 7zm0 0c1.5-3 5-3.5 5-1.5S14 7 12 7z"/>',
  wish:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="2.5"/>',
  dip:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/>',
  leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-4 6-7 10-9"/>',
  bread:'<path d="M4 13c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5v5H4z"/><path d="M9 10l-1.5 3M13 9.5l-1.5 3.5M17 10.5l-1.2 2.5"/>',
  cup:'<path d="M6 4h12l-1.5 15a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M6.5 9h11"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
  chev:'<path d="M9 5.5l6.5 6.5L9 18.5"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'
};
const ico=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const CATS=[
 {key:'wuensche',wish:true,icon:'wish',label:'Wünsche zum Fleisch',sub:'Fürs Pfännchen und zum Fondue',intro:'Was soll ins Pfännchen oder neben das Fleisch? Schreibt eure Wünsche auf, wir kümmern uns drum. Mit „Möchte ich auch“ seht ihr, was alle mögen.',ph:'Dein Wunsch …',sugg:['Zuckerschoten','Champignons','Kartöffelchen','Mais']},
 {key:'dips',icon:'dip',label:'Dips & Soßen',sub:'Ohne Soßen kein Fondue',intro:'Wer Lust hat, eine Soße zu machen: einfach eintragen. Gern mit Rezept, dann können’s andere nachmachen.',ph:'Soße oder Dip …',g:80,unit:'g',sugg:['Knoblauchsoße','Cocktailsoße','Currysoße','Kräuterquark']},
 {key:'salate',icon:'leaf',label:'Salate',sub:'Frisch zu Käse und Fleisch',intro:'Ein frischer Salat tut neben Käse und Fleisch richtig gut. Bring einfach mit, was du gern machst.',ph:'Welcher Salat?',g:100,unit:'g',sugg:['Grüner Salat','Gurkensalat','Krautsalat','Nudelsalat']},
 {key:'brot',icon:'bread',label:'Brot & Butter',sub:'Fladenbrot gehört dazu',intro:'Ohne Fladenbrot geht bei uns nix. Butter und Kräuterbutter sind auch immer gern gesehen.',ph:'Brot oder Butter …',g:100,unit:'g',sugg:['Fladenbrot','Baguette','Kräuterbutter']},
 {key:'getraenke',icon:'cup',label:'Getränke',sub:'Alles ohne Alkohol',intro:'Saft, Schorle, Punsch oder Wasser: Trag ein, was du mitbringst, sonst stehen am Ende fünf Flaschen Apfelschorle auf dem Tisch. 😄',ph:'Welches Getränk?',g:1.5,unit:'l',sugg:['Apfelschorle','Kinderpunsch','Orangensaft','Mineralwasser']}
];
const catOf=k=>CATS.find(c=>c.key===k);
const MEAT_G=250, CHEESE_G=200;
const nextYear=()=>{const d=new Date();return d.getFullYear()+(d.getMonth()===11&&d.getDate()>26?1:0)};
const afterParty=()=>{const d=new Date();return d.getMonth()===11&&d.getDate()>=25};

/* ---------- Zustand ---------- */
const data={info:{},gaeste:{},posten:{},antworten:{}};
let mode='loading', sb=null, me=store.get(ME_KEY)||'';
let tab=['abend','mitbringen','gaeste'].includes(location.hash.slice(1))?location.hash.slice(1):'abend';
let sheet=null; // {t:'item'|'guest'|'welcome'|'push', id, step}
let editRecipe=false, hostOpen=false, justTaken=null;
const chains={};

function list(col){return Object.entries(data[col]).map(([id,d])=>Object.assign({},d,{id})).sort((a,b)=>(a.t||0)-(b.t||0)||a.id.localeCompare(b.id))}
function guests(){return list('gaeste').map(g=>({...g,name:String(g.name||''),erw:+g.erw||0,kinder:+g.kinder||0,status:['ja','offen','nein'].includes(g.status)?g.status:'offen'}))}
function items(){return list('posten').filter(p=>catOf(p.kat)).map(p=>({...p,name:String(p.name||''),wer:String(p.wer||''),von:String(p.von||''),rezept:String(p.rezept||''),likes:Array.isArray(p.likes)?p.likes.map(String):[]}))}
const replies=pid=>list('antworten').filter(r=>r.posten===pid);
const gname=id=>(data.gaeste[id]&&data.gaeste[id].name)||'Jemand';
const short=id=>{const n=gname(id).replace(/\s*\(.*?\)\s*/g,' ').trim();return n||'Jemand'};
const isWish=p=>p.kat==='wuensche';
const isPlural=id=>/&|\bund\b/.test(short(id));
const initials=n=>{const w=String(n).replace(/[^\p{L}\s&]/gu,'').split(/\s|&/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()};
function counts(gs){const z=gs.filter(g=>g.status==='ja');const e=z.reduce((a,g)=>a+g.erw,0),k=z.reduce((a,g)=>a+g.kinder,0);return{e,k,n:e+k,p:e+k*.5,open:gs.filter(g=>g.status==='offen').length}}

/* ---------- Speichern ---------- */
function write(col,id,body){
  if(body===null)delete data[col][id]; else data[col][id]=Object.assign({},body,{id});
  render();
  if(mode!=='shared')return;
  const path=col+'/'+id,row=body===null?null:Object.assign({},body,{id});
  chains[path]=(chains[path]||Promise.resolve()).then(async()=>{
    const {error}=row===null?await sb.from(col).delete().eq('id',id):await sb.from(col).upsert(row);
    if(error)throw error;
  }).catch(e=>{console.error(e);toast('Hat gerade nicht geklappt. Check kurz dein Internet und versuch’s nochmal.')});
}
const setInfo=patch=>write('info','main',Object.assign({datum:'',fleisch:''},data.info.main||{},patch));
function notify(text){if(mode!=='shared'||!text||STUMM)return;sb.functions.invoke('notify',{body:{title:'Heiligabend bei Andy, Mel & Connor',body:text,actor:me||''}}).catch(()=>{})}
async function toggleLike(id){
  const p=data.posten[id];if(!p||!me)return;const l=(p.likes||[]).slice(),i=l.indexOf(me);i>=0?l.splice(i,1):l.push(me);
  data.posten[id]={...p,likes:l};render();
  if(mode!=='shared')return;
  const {error}=await sb.rpc('toggle_like',{p_id:id,g_id:me});if(error){console.error(error);toast('Das hat gerade nicht geklappt.')}
}
function take(id,on){
  const p=data.posten[id];if(!p)return;
  write('posten',id,{...p,wer:on?me:''});
  if(on){justTaken=id;render();toast(`Danke dir! ${p.name} steht jetzt bei dir.`);notify(`${short(me)} bringt ${p.name} mit. Danke! ✨`)}
  else{toast(`Kein Ding, ${p.name} ist wieder frei.`);notify(`${p.name} ist wieder frei. Wer mag es mitbringen?`)}
}
function setMe(id){me=id;store.set(ME_KEY,id);if(pushState==='on'&&swReg)swReg.pushManager.getSubscription().then(s=>s&&saveSub(s)).catch(()=>{})}
function setStatus(id,st){
  const g=data.gaeste[id];if(!g||g.status===st)return;
  write('gaeste',id,{...g,status:st});
  const n=g.name.replace(/\s*\(.*?\)\s*/g,' ').trim();
  notify(st==='ja'?`${n} ${/&|und/.test(n)?'sind':'ist'} an Heiligabend dabei 🎄`:st==='nein'?`${n} ${/&|und/.test(n)?'können':'kann'} dieses Jahr leider nicht. Wir denken an euch.`:'');
}

/* ---------- Push & Installation ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOK='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
let pushState='checking', swReg=null, installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
function b64(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function saveSub(sub){if(!sb||DEMO)return;const j=sub.toJSON();const {error}=await sb.rpc('push_abo',{p_endpoint:j.endpoint,p_sub:j,p_gast:me||''});if(error)throw error}
async function initPush(){
  if(DEMO){pushState=isIOS&&!standalone?'ios-install':'off';render();return}
  if('serviceWorker' in navigator){try{swReg=await navigator.serviceWorker.register('sw.js')}catch(e){console.error(e)}}
  if(!pushOK||!swReg){pushState=isIOS&&!standalone?'ios-install':'unsupported';render();return}
  if(Notification.permission==='denied'){pushState='denied';render();return}
  try{const sub=await swReg.pushManager.getSubscription();pushState=sub?'on':'off';if(sub&&me)saveSub(sub).catch(()=>{})}catch(e){pushState='off'}
  render();
}
async function enablePush(){
  if(DEMO){toast('Vorschau: Benachrichtigungen wären jetzt an.');pushState='on';render();return true}
  pushState='busy';render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';render();return false}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)});
    await saveSub(sub);pushState='on';toast('Benachrichtigungen sind an. Du bist auf Stand.');render();return true;
  }catch(e){console.error(e);pushState='off';toast('Hat nicht geklappt. Versuch’s gleich nochmal.');render();return false}
}
async function disablePush(){
  if(!DEMO){try{const sub=swReg&&await swReg.pushManager.getSubscription();if(sub){await sb.rpc('push_abmelden',{p_endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){console.error(e)}}
  pushState='off';toast('Benachrichtigungen sind aus.');render();
}
const IOS_HOWTO=`<ol class="howto"><li><span>Öffne den Link in <b>Safari</b>.</span></li><li><span>Tippe unten links in der Adressleiste auf <b>≡</b> und dann auf <b>Teilen</b>. Auf älteren iPhones tippst du direkt auf das Teilen-Symbol (Quadrat mit Pfeil nach oben).</span></li><li><span>Scrolle etwas nach unten, wähle <b>„Zum Home-Bildschirm“</b> und tippe auf <b>Hinzufügen</b>.</span></li><li><span>Öffne die App über das neue Symbol auf deinem Home-Bildschirm. Wenn du da zusagst, sind die Benachrichtigungen gleich mit an.</span></li></ol>`;

/* ---------- Bausteine ---------- */
function itemRow(p,showCat){
  const rs=replies(p.id).length, k=catOf(p.kat), mine=me&&p.wer===me;
  const sub=[];
  if(showCat)sub.push(`<span class="catlbl">${esc(k.label)}</span>`);
  else if(p.von&&data.gaeste[p.von])sub.push(`<span>${isWish(p)?'Wunsch':'Idee'} von ${esc(short(p.von))}</span>`);
  if(!isWish(p)&&p.likes.length)sub.push(`<span>${ico('heart')} ${p.likes.length}</span>`);
  if(rs)sub.push(`<span>${ico('chat')} ${rs}</span>`);
  if(p.rezept)sub.push(`<span>${ico('book')} Rezept</span>`);
  let side;
  if(isWish(p)){const on=me&&p.likes.includes(me);side=`<button class="chip like" data-a="like" aria-pressed="${on}">${ico('heart')} ${on?'Ich auch':'Möchte ich auch'}${p.likes.length?' · '+p.likes.length:''}</button>`}
  else if(mine)side=`<span class="chip me${justTaken===p.id?' pop':''}">${ico('check')} ${isPlural(me)?'Bringt ihr':'Bringst du'}</span>`;
  else if(p.wer)side=`<span class="chip ok" title="${esc(short(p.wer))} bringt es mit">${ico('check')}<span class="nm">${esc(short(p.wer))}</span></span>`;
  else side=`<button class="chip take" data-a="take">Bring ich mit</button>`;
  return `<div class="row" data-p="${esc(p.id)}"><button class="main" data-a="open-item" aria-label="${esc(p.name)} öffnen"><span class="t">${esc(p.name)}</span>${sub.length?`<span class="s">${sub.join('')}</span>`:''}</button>${side}</div>`;
}
function guestRow(g){
  const lbl={ja:/&|\bund\b/.test(g.name)?'Sind dabei':'Ist dabei',offen:'Noch offen',nein:'Dieses Jahr nicht'}[g.status];
  const who=[g.erw?`${g.erw} ${g.erw===1?'Erwachsener':'Erwachsene'}`:'',g.kinder?`${g.kinder} ${g.kinder===1?'Kind':'Kinder'}`:''].filter(Boolean).join(' · ');
  return `<div class="row" data-g="${esc(g.id)}"><span class="av" aria-hidden="true">${esc(initials(g.name))}</span><button class="main" data-a="open-guest"><span class="t">${esc(g.name||'Ohne Namen')}${g.id===me?' <span class="catlbl">· du</span>':''}</span><span class="s">${who||'&nbsp;'}</span></button><span class="chip st-${g.status}">${lbl}</span></div>`;
}

/* ---------- Bereiche ---------- */
function viewAbend(gs,its,c,info){
  let h='';
  const meG=me&&data.gaeste[me]?guests().find(g=>g.id===me):null;
  const host=meG&&me==='andreas', many=meG&&isPlural(me);
  const hello=!meG?'Schön, dass du da bist!':host?'Hallo, ihr Gastgeber!':many?`Schön, dass ihr da seid, ${esc(short(me))}!`:`Schön, dass du da bist, ${esc(short(me))}!`;
  h+=`<section class="panel welcome"><p class="eyebrow">Herzlich willkommen</p><h2>${hello}</h2>
    <p>Wie jedes Jahr gibt’s an Heiligabend Raclette &amp; Fondue. Ums Fleisch kümmern wir uns. Alles andere kann, muss aber nicht: Bringt einfach mit, worauf ihr Lust habt. Hauptsache, wir sitzen alle zusammen.</p>
    ${info.fleisch?`<p class="note"><b>Noch ein Wort von uns</b>${esc(info.fleisch)}</p>`:''}
    <p class="sign">Andy, Mel &amp; Connor</p>`;
  if(!meG)h+=`<button class="btn gold" data-a="welcome">Los geht’s</button>`;
  else{
    const st=host?'Hier seht ihr alles, was die anderen so planen.':many?{ja:'Ihr seid dabei, wie schön! Wir freuen uns auf euch.',offen:'Wär schön, wenn ihr dabei seid!',nein:'Schade, dass es dieses Jahr nicht klappt. Wenn sich was ändert, kommt einfach!'}[meG.status]
      :{ja:'Du bist dabei, wie schön! Wir freuen uns auf dich.',offen:'Wär schön, wenn du dabei bist!',nein:'Schade, dass es dieses Jahr nicht klappt. Wenn sich was ändert, komm einfach!'}[meG.status];
    h+=`<div class="mystatus"><span>${st}</span>${host?'':`<button class="link" data-a="welcome-kommst">${meG.status==='ja'?'Ändern':'Antworten'}</button>`}</div>`;
    if(pushState==='on')h+=`<div class="mystatus">${ico('bell')}<span>Benachrichtigungen sind an.</span><button class="link" data-a="push-off">Ausschalten</button></div>`;
    else if(pushState==='off')h+=`<div class="mystatus">${ico('bell')}<span>Benachrichtigungen sind aus.</span><button class="link" data-a="push-on">Einschalten</button></div>`;
  }
  h+=`</section>`;
  if(afterParty()&&its.length)h+=`<section class="panel thanks"><p class="eyebrow" style="color:var(--gold)">Danke</p><h2>Was für ein schöner Abend ❤️</h2><p>Danke an alle, die gekocht, mitgebracht und mitgefeiert haben. Wir freuen uns schon aufs nächste Jahr.</p></section>`;
  else h+=guide(meG,its);

  /* Dein Beitrag */
  if(meG){
    const mine=its.filter(p=>p.wer===me&&!isWish(p));
    h+=`<section class="sec"><div class="sec-h"><span class="k">Dein Beitrag</span><h2>${mine.length?(many?'Das bringt ihr mit':'Das bringst du mit'):'Noch nichts eingetragen'}</h2>${mine.length?'':`<p>Kein Druck. Wenn ${many?'ihr mögt, sucht euch':'du magst, such dir'} unten was aus oder ${many?'tragt':'trag'} eine eigene Idee ein.</p>`}</div>
      ${mine.length?`<div class="panel rows">${mine.map(p=>itemRow(p,true)).join('')}</div>`:''}</section>`;
  }

  /* Hilfe willkommen */
  const open=its.filter(p=>!p.wer&&!isWish(p)), done=its.filter(p=>p.wer&&!isWish(p)).length, total=done+open.length;
  h+=`<section class="sec"><div class="sec-h"><span class="k">Die Tafel</span><h2>${!total?'Noch ist der Tisch leer':open.length?'Da freuen wir uns noch über Hilfe':'Alles ist vergeben'}</h2><p>${!total?'Magst du anfangen? Trag ein, was du mitbringen würdest, oder einfach eine Idee.':open.length?'Das hier hat noch keiner. Ein Tipp auf „Bring ich mit“ reicht.':'Klasse, danke euch! Neue Ideen gehen trotzdem immer.'}</p></div>`;
  if(total)h+=`<div class="panel progress"><div class="lbl"><span><b>${done} von ${total}</b> haben schon jemanden</span><span>${Math.round(done/total*100)} %</span></div><div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div></div>`;
  if(open.length)h+=`<div class="panel rows">${open.map(p=>itemRow(p,true)).join('')}</div>`;
  h+=`<div class="center"><button class="btn ghost" data-a="tab" data-v="mitbringen">${ico('basket')} Alles ansehen oder eigene Idee eintragen</button></div></section>`;

  /* Wünsche kurz */
  const wishes=its.filter(isWish).sort((a,b)=>b.likes.length-a.likes.length).slice(0,3);
  if(wishes.length)h+=`<section class="sec"><div class="sec-h"><span class="k">Wünsche zum Fleisch</span><h2>Das wünscht ihr euch</h2></div><div class="panel rows">${wishes.map(p=>itemRow(p,false)).join('')}</div></section>`;

  /* Gastgeber */
  h+=hostArea(gs,its,c,info);
  h+=`<footer class="foot"><p class="tradition">Frohe Weihnachten</p><p>Wir freuen uns auf einen schönen Abend mit euch!</p></footer>`;
  return h;
}

function guide(meG,its){
  const pushDone=['on','denied','unsupported'].includes(pushState);
  const s1=!!meG&&meG.status!=='offen', s2=!!meG&&its.some(p=>p.wer===me&&!isWish(p)), s3=pushDone;
  if(s1&&s2&&s3)return '';
  const m=meG&&isPlural(me), st=(done,n,t,sub,act,go)=>`<button class="gstep${done?' done':''}" data-a="${act}"><span class="n">${done?ico('check'):n}</span><span><b>${t}</b><small>${sub}</small></span>${done?'':`<span class="go" aria-label="${go}">${ico('chev')}</span>`}</button>`;
  return `<section class="panel guide"><p class="eyebrow" style="color:var(--gold)">So einfach geht’s</p><h3>Drei kleine Schritte</h3><p>Alles freiwillig, nichts muss. Hilft uns aber beim Planen.</p>
    ${st(s1,1,m?'Sagt Bescheid, ob ihr kommt':'Sag Bescheid, ob du kommst',meG?(meG.status==='ja'?(m?'Ihr seid dabei. Wie schön!':'Du bist dabei. Wie schön!'):meG.status==='nein'?'Danke, dass du Bescheid gesagt hast.':'Ja, nein oder weiß noch nicht, alles okay.'):'Ja, nein oder weiß noch nicht, alles okay.','welcome','Antworten')}
    ${st(s2,2,m?'Sucht euch etwas aus':'Such dir etwas aus','Salat, Soße, Brot, Getränke oder was ganz Eigenes.','tab-mitbringen','Ansehen')}
    ${st(s3,3,m?'Bleibt auf Stand':'Bleib auf Stand',pushState==='on'?'Benachrichtigungen sind an.':'Nur wenn sich am Plan was ändert. Kein Spam.','guide-push','Einschalten')}
  </section>`;
}
function viewMitbringen(gs,its){
  let h=`<section class="sec"><div class="sec-h"><span class="k">Mitbringen</span><h2>Was auf den Tisch kommt</h2><p>Ums Fleisch kümmern wir uns gern. Für alles drumherum freuen wir uns über eure Ideen. Jeder bringt mit, worauf er Lust hat.</p></div>
    <nav class="jump" aria-label="Zu einer Kategorie springen">${CATS.map(k=>{const o=its.filter(p=>p.kat===k.key&&!p.wer&&!k.wish).length;return `<a href="#k-${k.key}" data-a="jump">${esc(k.label)}${o?`<small>${o}</small>`:''}</a>`}).join('')}</nav></section>`;
  for(const k of CATS){
    const all=its.filter(p=>p.kat===k.key);
    if(k.wish)all.sort((a,b)=>b.likes.length-a.likes.length||(a.t||0)-(b.t||0));
    h+=`<section class="panel" id="k-${k.key}" style="scroll-margin-top:16px"><div class="cat-h"><span class="em">${ico(k.icon)}</span><div><h3>${esc(k.label)}</h3><div class="sub">${esc(k.sub)}</div></div></div><p class="cat-intro">${esc(k.intro)}</p>
      <div class="rows" style="border-top:1px solid var(--line)">${all.length?all.map(p=>itemRow(p,false)).join(''):`<div class="empty">Noch leer. Magst du anfangen?</div>`}</div>
      <form class="addform" data-form="add" data-k="${k.key}"><input type="text" id="add-${k.key}" placeholder="${esc(k.ph)}" aria-label="${esc(k.label)}: Eintrag hinzufügen" autocomplete="off" enterkeyhint="done">${k.wish?'':`<label><input type="checkbox" id="mine-${k.key}"> Bring ich mit</label>`}<button class="btn small" type="submit">${ico('plus')} Eintragen</button></form>`;
    const names=new Set(all.map(p=>p.name.trim().toLowerCase())),left=k.sugg.filter(s=>!names.has(s.toLowerCase()));
    if(all.length<4&&left.length)h+=`<div class="sugg"><span>Ideen zum Antippen:</span>${left.map(s=>`<button data-a="sugg" data-k="${k.key}" data-v="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div>`;
    h+=`</section>`;
  }
  return h;
}

function viewGaeste(gs,c){
  const by=s=>gs.filter(g=>g.status===s);
  let h=`<section class="sec"><div class="sec-h"><span class="k">Gäste</span><h2>Wer an Heiligabend dabei ist</h2><p>${c.n?`${c.e} ${c.e===1?'Erwachsener':'Erwachsene'}${c.k?` und ${c.k} ${c.k===1?'Kind':'Kinder'}`:''} haben schon zugesagt.`:'Noch hat niemand zugesagt.'} Tipp auf einen Namen, wenn du was ändern willst.</p></div>`;
  for(const [s,t] of [['ja','Sind dabei'],['offen','Wir hoffen, ihr könnt kommen'],['nein','Dieses Jahr leider nicht']]){
    const l=by(s);if(!l.length)continue;
    h+=`<div class="sec-h" style="margin-top:4px"><span class="k">${t}</span></div><div class="panel rows">${l.map(guestRow).join('')}</div>`;
  }
  h+=`<form class="panel addform" data-form="gadd" style="border-top:1px solid var(--line)"><input type="text" id="g-new" placeholder="Jemand fehlt? Name eintragen" aria-label="Gast hinzufügen" autocomplete="off"><button class="btn small" type="submit">${ico('plus')} Hinzufügen</button></form></section>`;
  return h;
}

function hostArea(gs,its,c,info){
  const ny=nextYear();
  const li=c.p?[['Fleisch fürs Fondue',c.e?amount(c.e*MEAT_G,'g'):'–'],['Raclettekäse',amount(c.p*CHEESE_G,'g')]].concat(CATS.filter(k=>k.g).map(k=>[k.label,amount(c.p*k.g,k.unit)])):[];
  return `<details class="host" id="host"${hostOpen?' open':''}><summary>${ico('key')} Nur für uns Gastgeber</summary><div class="in">
    <label class="field"><span>Wann geht’s los?</span><input class="inp" id="datum" data-f="datum" value="${esc(info.datum)}" placeholder="z. B. 24.12. um 18 Uhr" enterkeyhint="done"><small>Steht oben in der Einladung.</small></label>
    <label class="field"><span>Ein Wort an alle (optional)</span><textarea class="inp" id="fleisch" data-f="fleisch" rows="2" placeholder="z. B. Bringt gern eure Lieblingssoße mit!">${esc(info.fleisch)}</textarea><small>Erscheint in der Begrüßung. Speichert, sobald du das Feld verlässt.</small></label>
    ${li.length?`<div class="field"><span>Grobe Mengen für ${c.n} ${c.n===1?'Person':'Personen'}</span><ul class="amounts">${li.map(([k,v])=>`<li>${esc(k)}</li><li><b>~${v}</b></li>`).join('')}</ul><small>Nur zur Orientierung, Kinder zählen halb.</small></div>`:''}
    <div class="field"><span>Stand in die WhatsApp-Gruppe</span><button class="btn ghost" data-a="copy" type="button">${ico('copy')} Kurzen Stand kopieren</button><small id="copy-hint">Kurzer Text mit Zusagen und dem, was noch fehlt. Einfach in die Gruppe kopieren.</small><textarea class="inp" id="wa" rows="8" hidden readonly></textarea></div>
    <form class="field" data-form="reset"><span class="hostsub">Nach dem Fest: Neues Jahr vorbereiten</span><small>Die Gäste bleiben, alle Zusagen gehen auf „Noch offen“. Mitbringsel, Kommentare, Rezepte, Termin und Hinweis werden gelöscht. Der Link bleibt gleich.</small>
      <label class="field"><span>Zum Bestätigen ${ny} eingeben</span><span style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" style="flex:1;min-width:120px;max-width:180px" id="reset-year" inputmode="numeric" autocomplete="off" placeholder="${ny}"><button class="btn small" type="submit">Liste für ${ny} vorbereiten</button></span></label></form>
  </div></details>`;
}

function waText(gs,its,c,info){
  const L=['🎄 *Heiligabend bei Andy, Mel & Connor*','Raclette & Fondue'+(info.datum?' · '+info.datum:'')];
  const zu=gs.filter(g=>g.status==='ja').map(g=>g.name.replace(/\s*\(.*?\)\s*/g,' ').trim()).filter(Boolean);
  if(zu.length)L.push('','✨ Schon dabei: '+zu.join(', '));
  const open=its.filter(p=>!p.wer&&!isWish(p));
  if(open.length){L.push('','Da freuen wir uns noch über Hilfe:');for(const p of open)L.push('• '+p.name)}
  else L.push('','Alles ist vergeben, danke euch! ❤️');
  L.push('','Wer mag, trägt sich einfach in der App ein. Ums Fleisch kümmern wir uns gern 🙂',location.origin+location.pathname);
  return L.join('\n');
}

/* ---------- Blätter ---------- */
function sheetHTML(){
  const gs=guests(), close=`<button class="close" data-a="close" aria-label="Schließen">${ico('x')}</button>`;
  if(!sheet)return'';
  if(sheet.t==='welcome'){
    const st=sheet.step, nr={wer:1,kommst:2,push:3}[st];
    let h=close+`<div class="steps" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=nr?'on':''}"></i>`).join('')}</div>`;
    if(st==='wer'){
      h+=`<h2 id="sheet-title" class="center" style="padding:0">Herzlich willkommen 🎄</h2><p class="lead center">Schön, dass du da bist! Tipp kurz auf deinen Namen, dann wissen alle, von wem was kommt.</p>
        <div class="blk"><div class="tiles">${gs.map(g=>`<button class="tile" data-a="pick" data-v="${esc(g.id)}" aria-pressed="${g.id===me}"><span class="av" aria-hidden="true">${esc(initials(g.name))}</span>${esc(g.name||'Ohne Namen')}</button>`).join('')}</div></div>
        <form class="blk" data-form="welcome-new"><h4>Du fehlst in der Liste?</h4><div class="msgform"><input class="inp" id="w-new" placeholder="Dein Name" autocomplete="off"><button class="btn small" type="submit">Weiter</button></div></form>
        <p class="hint center" style="margin-top:16px">Merkt sich nur dein Handy. <button class="link" data-a="close">Erst mal nur umschauen</button></p>`;
    }else if(st==='kommst'){
      const g=gs.find(x=>x.id===me);if(!g){sheet.step='wer';return sheetHTML()}
      const m=isPlural(me);
      h+=`<h2 id="sheet-title" class="center" style="padding:0">Hallo ${esc(short(me))}!</h2><p class="lead center">${m?'Seid ihr':'Bist du'} an Heiligabend dabei? Egal wie, alles gut. Ändern ${m?'könnt ihr':'kannst du'}’s jederzeit.</p>
        <div class="blk seg">
          <button class="opt" data-a="answer" data-v="ja" aria-pressed="${g.status==='ja'}"><span class="em">🎄</span><span>${m?'Ja, wir sind dabei!':'Ja, ich bin dabei!'}<small>Wir freuen uns riesig! Und wir halten ${m?'euch':'dich'} auf Stand.</small></span></button>
          <button class="opt" data-a="answer" data-v="offen" aria-pressed="${g.status==='offen'}"><span class="em">🕯️</span><span>${m?'Wissen wir noch nicht':'Weiß ich noch nicht'}<small>Kein Stress, ${m?'sagt einfach Bescheid, wenn ihr’s wisst':'sag einfach Bescheid, wenn du’s weißt'}.</small></span></button>
          <button class="opt" data-a="answer" data-v="nein" aria-pressed="${g.status==='nein'}"><span class="em">💌</span><span>Dieses Jahr leider nicht<small>Schade! Falls sich was ändert: ${m?'Ihr seid':'Du bist'} immer willkommen.</small></span></button>
        </div>
        ${g.status==='ja'?`<div class="blk"><h4>${m?'Wie viele seid ihr?':'Kommt noch jemand mit?'}</h4>${stepper(g,'erw','Erwachsene')}${stepper(g,'kinder','Kinder')}</div>`:''}
        <div class="blk stick"><button class="btn wide" data-a="w-next">Weiter</button></div>`;
    }else if(st==='push'){
      if(pushState==='on'){h+=`<h2 id="sheet-title" class="center" style="padding:0">Du bist auf Stand 🔔</h2><p class="lead center">Du kriegst nur Bescheid, wenn sich am Plan für Heiligabend was tut: wer kommt, wer was mitbringt, ob sich die Uhrzeit ändert oder dir jemand antwortet. Damit am Abend keiner überrascht dasteht. Kein Spam, kein Gequatsche, versprochen. Ausschalten geht trotzdem jederzeit, auch später auf der Startseite.</p>
        <div class="blk"><button class="btn wide" data-a="close">Fertig</button><button class="btn wide ghost" data-a="push-off-w">Benachrichtigungen ausschalten</button></div>`;return h}
      h+=`<h2 id="sheet-title" class="center" style="padding:0">Sollen wir dir Bescheid geben?</h2><p class="lead center">Damit du immer weißt, was an Heiligabend läuft: wer kommt, wer was mitbringt, ob sich die Uhrzeit ändert. Nur das, was wichtig ist. Kein Spam, kein Gequatsche.</p>`;
      if(pushState==='ios-install')h+=`<div class="blk">${IOS_HOWTO}</div><div class="blk"><button class="btn wide" data-a="close">Alles klar</button></div>`;
      else if(pushState==='off'||pushState==='busy')h+=`<div class="blk"><button class="btn wide" data-a="push-on-w"${pushState==='busy'?' disabled':''}>${ico('bell')} Ja, gerne</button><button class="btn wide ghost" data-a="close">Lieber nicht</button></div>`;
      else h+=`<div class="blk"><p class="center">${pushState==='on'?'Benachrichtigungen sind schon an. Perfekt!':pushState==='denied'?'Auf deinem Handy sind die Mitteilungen für die App gesperrt. In den Einstellungen kannst du sie wieder erlauben.':'Dein Browser kann leider keine Benachrichtigungen. Am besten klappt’s mit Safari auf dem iPhone oder Chrome auf Android.'}</p><button class="btn wide" data-a="close">Fertig</button></div>`;
    }
    return h;
  }
  if(sheet.t==='push')return close+`<h2 id="sheet-title">So bekommst du Benachrichtigungen</h2><p class="lead">Auf dem iPhone klappt das, sobald die App auf deinem Home-Bildschirm liegt.</p><div class="blk">${IOS_HOWTO}</div><div class="blk"><button class="btn wide" data-a="close">Alles klar</button></div>`;
  if(sheet.t==='item'){
    const p=items().find(x=>x.id===sheet.id);if(!p){sheet=null;return''}
    const k=catOf(p.kat), rs=replies(p.id), mine=me&&p.wer===me, liked=me&&p.likes.includes(me);
    let h=close+`<p class="catlbl">${esc(k.label)}</p><input class="titleinp" id="it-name" data-f="pname" value="${esc(p.name)}" aria-label="Bezeichnung">`;
    if(p.von&&data.gaeste[p.von])h+=`<p class="lead">${isWish(p)?'Wunsch':'Idee'} von ${esc(short(p.von))}</p>`;
    if(!isWish(p)){
      h+=`<div class="blk"><h4>Wer bringt es mit?</h4>`;
      if(mine)h+=`<p>${isPlural(me)?'Das bringt ihr mit. Danke euch!':'Das bringst du mit. Danke dir!'} ✨</p><button class="btn ghost" data-a="untake">Doch nicht, wieder freigeben</button>`;
      else if(p.wer)h+=`<p>${esc(short(p.wer))} bringt es mit.</p>`;
      else h+=`<p class="hint">Hat noch keiner. Magst du?</p><button class="btn gold" data-a="take">${ico('check')} Bring ich mit</button>`;
      h+=`<label class="field" style="margin-top:6px"><small>Für wen anderes eintragen</small><select class="inp" data-f="pwer" id="it-wer"><option value="">Sucht noch jemanden</option>${gs.filter(g=>g.status!=='nein'||g.id===p.wer).map(g=>`<option value="${esc(g.id)}"${g.id===p.wer?' selected':''}>${esc(g.name)}</option>`).join('')}</select></label></div>`;
    }
    h+=`<div class="blk"><h4>${isWish(p)?'Möchten auch':'Hab Lust drauf'}</h4><div><button class="chip like" data-a="like" aria-pressed="${!!liked}">${ico('heart')} ${isWish(p)?(liked?'Ich auch':'Möchte ich auch'):(liked?'Ich hab Lust drauf':'Hab Lust drauf')}</button></div>${p.likes.length?`<p class="likers">${p.likes.map(l=>esc(short(l))).join(', ')}</p>`:''}</div>`;
    h+=`<div class="blk"><h4>Rezept</h4>`;
    if(p.rezept&&!editRecipe)h+=`<div class="rztext">${esc(p.rezept)}</div><div><button class="link" data-a="rz-edit">Rezept bearbeiten</button></div>`;
    else if(editRecipe)h+=`<form class="field" data-form="rezept"><textarea class="inp" id="rz" rows="8" placeholder="Zutaten und Zubereitung, so wie du es machst …">${esc(p.rezept)}</textarea><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" type="submit">Rezept speichern</button><button class="btn small ghost" type="button" data-a="rz-cancel">Abbrechen</button></span></form>`;
    else h+=`<p class="hint">Selbst gemacht? Teil dein Rezept, dann können’s andere nachmachen.</p><div><button class="btn small ghost" data-a="rz-edit">${ico('book')} Rezept teilen</button></div>`;
    h+=`</div><div class="blk"><h4>Kommentare</h4><div class="thread">${rs.map(r=>`<div class="msg" data-r="${esc(r.id)}"><b>${esc(short(r.von))}</b>${esc(r.inhalt)}<button class="x" data-a="rdel" aria-label="Kommentar löschen">${ico('x')}</button></div>`).join('')||'<p class="hint">Noch keine Kommentare. Fragen, Ideen, Vorfreude?</p>'}</div>
      <form class="msgform" data-form="reply"><input class="inp" id="r-new" placeholder="Schreib was …" autocomplete="off" enterkeyhint="send"><button class="btn small" type="submit">Senden</button></form></div>
      <div class="blk"><button class="danger" data-a="pdel">Eintrag entfernen</button></div>`;
    return h;
  }
  if(sheet.t==='guest'){
    const g=gs.find(x=>x.id===sheet.id);if(!g){sheet=null;return''}
    return close+`<p class="catlbl">Gast</p><input class="titleinp" id="g-name" data-f="gname" value="${esc(g.name)}" aria-label="Name">
      <div class="blk"><h4>Heiligabend</h4><div class="seg">${[['ja','🎄','Ist dabei'],['offen','🕯️','Noch offen'],['nein','💌','Dieses Jahr nicht']].map(([v,e,l])=>`<button class="opt" data-a="gstatus" data-v="${v}" aria-pressed="${g.status===v}"><span class="em">${e}</span><span>${l}</span></button>`).join('')}</div></div>
      <div class="blk"><h4>Wie viele?</h4>${stepper(g,'erw','Erwachsene')}${stepper(g,'kinder','Kinder')}</div>
      ${g.id!==me?`<div class="blk"><button class="btn ghost" data-a="iam" data-v="${esc(g.id)}">Das bin ich</button></div>`:''}
      <div class="blk"><button class="danger" data-a="gdel">Von der Gästeliste nehmen</button></div>`;
  }
  return '';
}
const stepper=(g,k,l)=>`<div class="stepper" data-g="${esc(g.id)}"><span>${l}</span><span class="ctl"><button data-a="gstep" data-k="${k}" data-d="-1" aria-label="${l}: eins weniger"${g[k]<=0?' disabled':''}>−</button><output>${g[k]}</output><button data-a="gstep" data-k="${k}" data-d="1" aria-label="${l}: eins mehr">+</button></span></div>`;

/* ---------- Zeichnen ---------- */
function paint(el,html){
  const a=document.activeElement, keep=a&&a.id&&el.contains(a)?{id:a.id,v:a.value,s:'selectionStart' in a?[a.selectionStart,a.selectionEnd]:null}:null;
  const drafts=[...el.querySelectorAll('form input[id], form textarea[id]')].filter(i=>i.type!=='checkbox'&&i.value).map(i=>[i.id,i.value]);
  const checks=[...el.querySelectorAll('form input[type=checkbox]')].map(i=>[i.id,i.checked]);
  const st=el.scrollTop;
  el.innerHTML=html;
  for(const [id,v] of drafts){const n=document.getElementById(id);if(n)n.value=v}
  for(const [id,v] of checks){const n=document.getElementById(id);if(n)n.checked=v}
  el.scrollTop=st;
  if(keep){const n=document.getElementById(keep.id);if(n){if(n.tagName==='TEXTAREA'||(n.tagName==='INPUT'&&n.type!=='checkbox'))n.value=keep.v;n.focus({preventScroll:true});if(keep.s&&n.setSelectionRange)try{n.setSelectionRange(keep.s[0],keep.s[1])}catch(e){}}}
}
let lastTab=null;
function render(){
  if(mode==='loading')return;
  const gs=guests(), its=items(), c=counts(gs), info=Object.assign({datum:'',fleisch:''},data.info.main||{});
  if(me&&!data.gaeste[me]){me='';}
  /* Kopf */
  const now=new Date(), y=now.getFullYear()+(now.getMonth()===11&&now.getDate()>26?1:0), xmas=new Date(y,11,24);
  const days=Math.max(0,Math.round((xmas-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5));
  $('#h-eyebrow').textContent='Heiligabend '+y;
  const fest=now.getMonth()===11&&(now.getDate()===25||now.getDate()===26);
  $('#f-days').textContent=fest?'✨':days===0?'Heute':days; $('#f-days-l').textContent=fest?'Frohe Weihnachten':days===0?'ist Heiligabend!':days===1?'Tag bis Heiligabend':'Tage bis Heiligabend';
  const tm=(info.datum.match(/(\d{1,2})[:.](\d{2})\s*(?:uhr)?\s*$/i)||info.datum.match(/(\d{1,2})\s*uhr/i));
  $('#f-when').textContent=tm?(tm[2]?`${tm[1]}:${tm[2]}`:`${tm[1]}:00`):'24.12.'; $('#f-when-l').textContent=tm?'Uhr geht’s los':'Uhrzeit folgt';
  $('#f-pers').textContent=c.n;
  $('#hero').classList.toggle('small',tab!=='abend');
  /* Leiste */
  const openN=its.filter(p=>!p.wer&&!isWish(p)).length;
  $('#tabs').innerHTML=[['abend','star','Der Abend'],['mitbringen','basket','Mitbringen'],['gaeste','people','Gäste']].map(([v,i,l])=>`<button data-a="tab" data-v="${v}"${tab===v?' aria-current="page"':''}>${ico(i)}${l}${v==='mitbringen'&&openN?`<span class="dot" aria-label="${openN} suchen noch jemanden">${openN}</span>`:''}</button>`).join('');
  /* Inhalt */
  const html=tab==='mitbringen'?viewMitbringen(gs,its):tab==='gaeste'?viewGaeste(gs,c):viewAbend(gs,its,c,info);
  const m=$('#main');
  if(lastTab!==tab){m.classList.remove('view');void m.offsetWidth;m.classList.add('view');lastTab=tab}
  paint(m,html);
  if(sheet&&dlg.open)paint($('#sh'),sheetHTML());
  justTaken=null;
}

function go(t){if(t===tab)return;tab=t;history.replaceState(null,'',location.pathname+location.search+(t==='abend'?'':'#'+t));render();scrollTo({top:0})}

/* ---------- Eingaben ---------- */

let undo=null;

  const t=e.target,f=t.dataset.f; if(!f)return;

    write('posten',p.id,{...p,[f==='pname'?'name':'wer']:v});if(f==='pwer'&&v)notify(`${short(v)} bringt ${p.name} mit. Danke! ✨`);return}

});

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,form=f.dataset.form;
  if(form==='reset'){resetYear(f);return}
  if(form==='rezept'){const p=data.posten[sheet&&sheet.id];if(!p)return;const v=f.querySelector('textarea').value.trim(),neu=!p.rezept;editRecipe=false;write('posten',p.id,{...p,rezept:v});
    if(v)toast('Danke fürs Teilen!');return}
  const inp=f.querySelector('input:not([type=checkbox])'),v=inp?inp.value.trim():'';if(!v)return;
  if(form==='add'){
    const k=f.dataset.k,mine=f.querySelector('input[type=checkbox]')?.checked;
    if(mine&&!needMe())return;
    const id=uid();write('posten',id,{kat:k,name:v,wer:mine?me:'',von:me||'',likes:[],rezept:'',t:Date.now()});
    if(mine)justTaken=id;

    const cb=f.querySelector('input[type=checkbox]');if(cb)cb.checked=false;
  }else if(form==='gadd'){write('gaeste',uid(),{name:v,erw:1,kinder:0,status:'offen',t:Date.now()});toast(`${v} steht jetzt auf der Gästeliste.`)}
  else if(form==='welcome-new'){const id=uid();write('gaeste',id,{name:v,erw:1,kinder:0,status:'offen',t:Date.now()});setMe(id);sheet.step='kommst';render()}
  else if(form==='reply'){if(!needMe())return;const p=data.posten[sheet&&sheet.id];if(!p)return;write('antworten',uid(),{posten:p.id,von:me,inhalt:v,t:Date.now()});notify(`${short(me)} zu „${p.name}“: ${v}`)}
  inp.value='';const n=document.getElementById(inp.id);if(n){n.value='';if(form!=='welcome-new')n.focus()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  const pid=b.closest('[data-p]')?.dataset.p||(sheet&&sheet.t==='item'?sheet.id:null);
  const gid=b.closest('[data-g]')?.dataset.g||(sheet&&sheet.t==='guest'?sheet.id:null);
  switch(a){
    case 'tab':go(b.dataset.v);return;
    case 'tab-mitbringen':go('mitbringen');return;
    case 'guide-push':if(pushState==='ios-install')openSheet({t:'push'});else if(pushState==='off')enablePush();return;
    case 'jump':{e.preventDefault();const t=document.querySelector(b.getAttribute('href'));if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}
    case 'close':closeSheet();return;
    case 'welcome':openSheet({t:'welcome',step:me?'kommst':'wer'});return;

    case 'answer':{setStatus(me,b.dataset.v);if(b.dataset.v==='ja'&&pushState==='off')enablePush();return}
    case 'w-next':{sheet.step='push';render();return}
    case 'push-off-w':disablePush();return;

    case 'push-on-w':enablePush().then(ok=>{if(ok)closeSheet()});return;

    case 'push-howto':openSheet({t:'push'});return;

    case 'open-guest':openSheet({t:'guest',id:gid});return;

    case 'rz-cancel':editRecipe=false;render();return;
    case 'sugg':{const k=b.dataset.k,v=b.dataset.v;write('posten',uid(),{kat:k,name:v,wer:'',von:me||'',likes:[],rezept:'',t:Date.now()});toast('Danke für die Idee!');notify(k==='wuensche'?`Neuer Wunsch zum Fleisch: ${v}`:`Neue Idee bei ${catOf(k).label}: ${v}`);return}
    case 'pdel':{const p=data.posten[pid];if(!p)return;undo=['posten',pid,p];closeSheet();write('posten',pid,null);toast(`„${p.name}“ entfernt.`,true);return}

    case 'copy':{const gs=guests(),its=items(),txt=waText(gs,its,counts(gs),Object.assign({datum:'',fleisch:''},data.info.main||{})),ta=$('#wa'),hint=$('#copy-hint');ta.value=txt;
      const fb=()=>{ta.hidden=false;ta.focus();ta.select();hint.textContent='Der Text ist markiert. Jetzt kopieren (lange drücken oder ⌘C) und in die Gruppe einfügen.'};
      try{navigator.clipboard.writeText(txt).then(()=>{hint.textContent='Kopiert! Jetzt einfach in die WhatsApp-Gruppe einfügen.';toast('Text kopiert.')},fb)}catch(err){fb()}return}
  }
});

async function resetYear(form){
  const ny=nextYear(),v=form.querySelector('input').value.trim();
  if(v!==String(ny)){toast(`Bitte genau ${ny} eingeben, dann wird die Liste zurückgesetzt.`);return}
  if(mode==='shared'){const {error}=await sb.rpc('neues_jahr');if(error){console.error(error);toast('Das Zurücksetzen hat nicht geklappt. Bitte noch einmal versuchen.');return}}
  hostOpen=false;data.posten={};data.antworten={};for(const id in data.gaeste)data.gaeste[id]={...data.gaeste[id],status:'offen'};data.info.main={...(data.info.main||{}),datum:'',fleisch:''};
  render();scrollTo({top:0,behavior:'smooth'});toast(`Die Liste für Weihnachten ${ny} ist bereit.`);
  notify(`Weihnachten ${ny} rückt näher! Die Liste ist bereit. Wir freuen uns auf euch.`);
}

let toastT;
function toast(msg,withUndo){
  const r=$('#toast-root');clearTimeout(toastT);
  r.innerHTML=`<div class="toast" role="status"><span></span>${withUndo?'<button type="button">Rückgängig</button>':''}</div>`;
  r.querySelector('span').textContent=msg;
  const u=r.querySelector('button');if(u)u.onclick=()=>{if(undo){write(undo[0],undo[1],undo[2]);undo=null}r.innerHTML=''};
  toastT=setTimeout(()=>{r.innerHTML=''},4500);
}

/* ---------- Lichter & Schnee (nur im Kopf) ---------- */
(function(){
  const L=$('#lights');const fill=()=>{const n=Math.max(10,Math.min(36,Math.round(L.clientWidth/34)));if(L.childElementCount!==n)L.innerHTML='<i class="bulb"></i>'.repeat(n)};fill();addEventListener('resize',fill);
  const cv=$('#snow'),ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,fl=[],raf=0;
  function size(){const d=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    fl=Array.from({length:Math.min(60,Math.round(W*H/6000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,s:.15+Math.random()*.35,w:Math.random()*6.28}));draw()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';for(const f of fl){ctx.globalAlpha=.25+f.r/4;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}ctx.globalAlpha=1}
  function tick(){for(const f of fl){f.y+=f.s;f.w+=.01;f.x+=Math.sin(f.w)*.25;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}}draw();raf=requestAnimationFrame(tick)}
  size();addEventListener('resize',size);new ResizeObserver(size).observe($('#hero'));
  if(!still){raf=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(tick)})}
})();

/* ---------- Start ---------- */
(async function(){
  initPush();
  if(DEMO){$('#demo').hidden=false;demoData();mode='demo';$('#status').hidden=true;render();if(!me||new URLSearchParams(location.search).has('neu')){me='';openSheet({t:'welcome',step:'wer'})}return}
  if(!window.supabase||!CFG.url){$('#status').textContent='Die App ist gerade nicht erreichbar. Bitte lade die Seite neu.';$('#status').dataset.kind='warn';return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  async function load(){const cols=['info','gaeste','posten','antworten'];const rs=await Promise.all(cols.map(c=>sb.from(c).select('*')));rs.forEach(r=>{if(r.error)throw r.error});cols.forEach((c,i)=>{data[c]=Object.fromEntries(rs[i].data.map(r=>[r.id,r]))})}
  try{await load();mode='shared';$('#status').hidden=true;render()}
  catch(e){console.error(e);$('#status').textContent='Die Liste ist gerade nicht erreichbar. Prüf kurz das Internet und lade die Seite neu.';$('#status').dataset.kind='warn';return}
  if(!me&&!store.sget('weihnachten-umschauen')){store.sset('weihnachten-umschauen','1');openSheet({t:'welcome',step:'wer'})}
  sb.channel('weihnachten').on('postgres_changes',{event:'*',schema:'public'},pl=>{
    const col=pl.table;if(!(col in data))return;
    if(pl.eventType==='DELETE'){if(pl.old&&pl.old.id)delete data[col][pl.old.id]}else data[col][pl.new.id]=pl.new;
    render();
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='shared')load().then(render).catch(()=>{})});
})();
})();
