<!doctype html>
<html lang="de">
<head>
<title>Heiligabend bei Andy, Mel & Connor</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071812">
<meta name="description" content="Raclette & Fondue an Heiligabend bei Andy, Mel & Connor: wer dabei ist, wer was mitbringt, Wünsche und Rezepte.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weihnachten">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Aufbau „Ein Abend bei Kerzenlicht“: immer abendlich (Tannennacht, Kerzengold), darauf helle Leinen-Tischkarte als einziges lautes Element.
   Oben die Einladung, die beim Scrollen einer schmalen Kopfzeile weicht. Vier Bereiche über die Leiste unten:
   „Der Abend“ (deine Tischkarte, ein Wort von uns, was noch fehlt, Gastgeber), „Fleisch“ (Vorlieben, Wünsche, Einkaufszettel), „Mitbringen“, „Gäste“.
   Einträge, Gäste und Fleisch-Vorlieben öffnen ein Blatt von unten. */
:root{
  --bg:#071812; --fir:#0e2a22; --panel:#0f2620; --panel-2:#153229; --line:rgba(226,182,92,.13); --line2:rgba(226,182,92,.26);
  --ink:#f1e8d5; --muted:#a9a08a; --gold:#e2b65c; --gold-2:#f0d08a; --gold-soft:rgba(226,182,92,.13); --on-gold:#1d1606;
  --cran:#e46f82; --cran-fill:#a3283c; --cran-soft:rgba(163,40,60,.28); --ok:#93d6a9; --ok-soft:rgba(147,214,169,.12);
  --linen:#f3eadb; --linen-2:#e9dcc4; --linen-ink:#1e2a24; --linen-muted:#6b634f; --berry:#8e2234;
  --on-fir:#f8f1e1; --on-fir-muted:#c9bc9a;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 22px 40px -26px rgba(0,0,0,.85);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:18px; --tabh:68px; --sat:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;overflow-x:clip;max-width:100%}
body{background:radial-gradient(140% 70% at 50% -10%,#123a2e 0%,var(--bg) 62%) no-repeat,var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---- Vorschau-Hinweis ---- */
.demo{background:var(--gold);color:var(--on-gold);font-size:13px;font-weight:600;text-align:center;padding:calc(7px + var(--sat)) 14px 7px;line-height:1.35}

/* ---- Kopfzeile beim Scrollen ---- */
.topbar{position:fixed;left:0;right:0;top:0;z-index:25;padding:calc(var(--sat) + 9px) 16px 10px;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s ease,transform .25s var(--ease-out)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),transparent);pointer-events:none}
.topbar.on{opacity:1;transform:none;pointer-events:auto}
.topbar .in{max-width:620px;width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.topbar b{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar span{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap}

/* ---- Kopf: Einladungskarte ---- */
.hero{position:relative;overflow:hidden;color:var(--on-fir);padding:calc(var(--sat) + 40px) 0 18px}
.demo:not([hidden])~.hero{padding-top:34px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:2}
.card-frame{position:relative;border-radius:22px;padding:38px 20px 30px;text-align:center;
  background:linear-gradient(180deg,rgba(20,62,47,.55),rgba(7,24,18,.2));
  box-shadow:inset 0 0 0 1px rgba(226,182,92,.42),inset 0 0 0 6px rgba(7,24,18,.0),inset 0 0 0 7px rgba(226,182,92,.16),0 30px 60px -40px rgba(0,0,0,.9)}
.orn{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);z-index:1}
.orn.top{top:14px}
.orn.bot{bottom:10px}
.eyebrow{font-family:var(--display);font-style:italic;font-size:19px;font-weight:500;color:var(--gold-2);letter-spacing:.01em}
.hero h1{font-size:clamp(36px,10vw,54px);line-height:1;margin:6px 0 10px;font-weight:600;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.menu{font-size:15px;color:var(--on-fir-muted);letter-spacing:.01em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-top:1px solid rgba(226,182,92,.2);padding-top:16px}
.fact{min-width:0;display:grid;gap:3px;padding:0 6px;align-content:start}
.fact+.fact{border-left:1px solid rgba(226,182,92,.16)}
.fact b,.pref-h b,.shop h3{font-variant-numeric:lining-nums}
.fact b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;color:var(--gold-2);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em}
.fact span{font-size:12.5px;color:var(--on-fir-muted);line-height:1.3}
.lights{position:absolute;left:0;right:0;top:var(--sat);height:34px;z-index:1;display:flex;justify-content:space-around;pointer-events:none;opacity:.9}
.demo:not([hidden])~.hero .lights{top:0}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:-16px;height:24px;border-bottom:1px solid rgba(0,0,0,.55);border-radius:0 0 50% 50%/0 0 100% 100%}
.bulb{position:relative;width:7px;height:11px;margin-top:6px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:radial-gradient(circle at 40% 35%,#fff 0 18%,var(--c) 50%);box-shadow:0 0 5px 1px var(--c),0 0 16px 4px var(--g)}
.bulb:nth-child(odd){margin-top:10px}
.bulb:nth-child(4n+1){--c:#ffcf6b;--g:rgba(255,207,107,.35)}.bulb:nth-child(4n+2){--c:#ff6b78;--g:rgba(255,107,120,.3)}.bulb:nth-child(4n+3){--c:#ffe3a3;--g:rgba(255,227,163,.35)}.bulb:nth-child(4n){--c:#8fe0b0;--g:rgba(143,224,176,.28)}
@media (prefers-reduced-motion:no-preference){.bulb{animation:tw 3.4s ease-in-out infinite}.bulb:nth-child(3n){animation-delay:-1.1s}.bulb:nth-child(3n+1){animation-delay:-2.2s}
  @keyframes tw{50%{opacity:.6}}}
.hero.small{padding:calc(var(--sat) + 30px) 0 10px}
.demo:not([hidden])~.hero.small{padding-top:26px}
.hero.small .card-frame{padding:16px 16px 14px;background:none;box-shadow:none}
.hero.small .orn,.hero.small .facts,.hero.small .menu{display:none}
.hero.small .eyebrow{font-size:16px}
.hero.small h1{font-size:clamp(28px,7.6vw,36px);margin:2px 0 0}

/* ---- Inhalt ---- */
main{padding:14px 0 calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
main>*,.sec>*,.panel,.row .main{min-width:0;max-width:100%}
h1,h2,h3,p,.t{overflow-wrap:anywhere}
.status{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--panel);color:var(--muted)}
.status[data-kind="warn"]{background:var(--cran-soft);color:var(--ink)}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sec-h{display:grid;gap:4px}
.sec-h .k{font-family:var(--display);font-style:italic;font-size:18px;font-weight:500;color:var(--gold)}
.sec-h h2{font-size:30px;line-height:1.08;letter-spacing:-.015em}
.sec-h p{color:var(--muted);font-size:15px;max-width:54ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}

/* ---- Deine Tischkarte (das eine laute Element) ---- */
.placecard{position:relative;color:var(--linen-ink);background:radial-gradient(120% 80% at 50% 0%,#fbf5ea,var(--linen) 60%,var(--linen-2));
  border-radius:16px;padding:22px 20px 14px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 30px 50px -28px rgba(0,0,0,.9),0 8px 18px -10px rgba(0,0,0,.5)}
.placecard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(142,34,52,.22);border-radius:11px;pointer-events:none}
.placecard .pc-k{font-family:var(--display);font-style:italic;font-size:17px;color:var(--linen-muted);text-align:center}
.placecard .pc-name{font-family:var(--script);font-size:clamp(40px,12vw,54px);line-height:1.05;color:var(--berry);text-align:center;margin:2px 0 10px;overflow-wrap:anywhere}
.placecard .pc-lead{text-align:center;color:var(--linen-ink);font-size:15.5px;max-width:40ch;margin:0 auto 12px}
.pc-lines{display:grid;border-top:1px solid rgba(30,42,36,.12)}
.pc-line{display:grid;grid-template-columns:30px 1fr 18px;gap:12px;align-items:center;text-align:left;width:100%;background:none;border:0;border-bottom:1px solid rgba(30,42,36,.1);padding:12px 2px;color:inherit;transition:transform .16s var(--ease-out)}
.pc-line:last-child{border-bottom:0}
.pc-line:active{transform:scale(.985)}
.pc-line .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(142,34,52,.45);color:var(--berry)}
.pc-line .n .ico{width:16px;height:16px;stroke-width:2}
.pc-line.done .n{background:#2f6b47;border-color:#2f6b47;color:#fff}
.pc-line b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.pc-line small{display:block;font-size:13.5px;color:var(--linen-muted);line-height:1.35;margin-top:1px}
.pc-line .go{color:var(--linen-muted)}
.pc-line .go .ico{width:18px;height:18px}
.placecard .btn{background:var(--linen-ink);border-color:var(--linen-ink);color:var(--linen)}
.pc-cta{display:flex;justify-content:center;padding:4px 0 8px}
@media (prefers-reduced-motion:no-preference){
  .placecard.arrive{animation:lay .9s var(--ease-out) both}
  @keyframes lay{from{opacity:0;transform:perspective(900px) rotateX(24deg) translateY(18px) scale(.97)}}
  .placecard.glow::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,236,190,.65) 50%,transparent 65%) -200% 0/250% 100% no-repeat;animation:shine 1.1s .1s var(--ease-out) forwards}
  @keyframes shine{to{background-position:200% 0}}}

/* Ein Wort von uns */
.word{padding:22px 20px 20px;display:grid;gap:12px}
.word p{font-family:var(--display);font-size:21px;line-height:1.4;font-weight:500;color:var(--ink);max-width:40ch}
.word .sign{font-family:var(--script);font-size:clamp(28px,8.4vw,36px);line-height:1.1;color:var(--gold);overflow-wrap:anywhere}
.mystatus{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:var(--gold);color:var(--on-gold);border-radius:999px;padding:11px 20px;font-weight:600;font-size:15px;line-height:1.25;white-space:normal;text-align:center;max-width:100%;transition:transform .16s var(--ease-out),background-color .15s ease}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:4px 2px;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* Zeilen */
.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:grid;gap:3px;text-align:left;background:none;border:0;padding:4px 0;color:inherit}
.row .t{font-weight:600;font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.row .s{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.row .s .ico{width:14px;height:14px;vertical-align:-2px}
.row .s span{display:inline-flex;gap:4px;align-items:center}
.catlbl{font-size:13px;font-weight:600;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;max-width:52%;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line2);background:transparent;color:var(--muted);line-height:1.2;transition:transform .16s var(--ease-out),background-color .15s ease}
button.chip:active{transform:scale(.95)}
.chip .ico{width:15px;height:15px}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok);max-width:48%}
.chip.ok .nm{overflow:hidden;text-overflow:ellipsis}
.chip.me{border-color:transparent;background:var(--gold-soft);color:var(--gold-2)}
.chip.take{border:1px solid var(--gold);color:var(--gold);background:transparent}
@media (hover:hover) and (pointer:fine){.chip.take:hover{background:var(--gold-soft)}}
.chip.like[aria-pressed="true"]{border-color:transparent;background:var(--cran-soft);color:var(--cran)}
.chip.st-ja{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.st-offen{border-style:dashed;color:var(--gold);border-color:var(--line2)}
.chip.st-nein{color:var(--muted)}
.empty{padding:18px;color:var(--muted);font-size:14.5px;text-align:center}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.88);opacity:.5}100%{transform:none;opacity:1}}

/* Fortschritt */
.progress{display:grid;gap:9px;padding:16px 18px}
.progress .bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.progress .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b98a35,var(--gold-2));transition:width .6s var(--ease-out)}
.progress .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.progress .lbl span:last-child{white-space:nowrap;font-weight:600;color:var(--gold)}
.progress .lbl b{color:var(--ink);font-weight:600}

/* Kategorien */
.cat-h{display:flex;gap:14px;align-items:center;padding:18px 18px 6px}
.cat-h .em{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.cat-h .em .ico{width:22px;height:22px}
.cat-h h3{font-size:25px;line-height:1.1}
.cat-h .sub{font-size:13.5px;color:var(--muted)}
.cat-intro{padding:4px 18px 14px;color:var(--muted);font-size:14.5px;max-width:56ch}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px 14px;border-top:1px solid var(--line)}
.addform input[type=text]{flex:1 1 180px;min-width:0;border:1px solid var(--line2);background:var(--panel-2);border-radius:999px;padding:10px 15px}
.addform input[type=text]::placeholder,.inp::placeholder{color:#8b8370}
.addform input[type=text]:focus{outline:none;border-color:var(--gold)}
.whosel{border:1px solid var(--line2);background:var(--panel-2);border-radius:999px;padding:10px 12px;font-size:14px;max-width:100%}
.whosel:focus{outline:none;border-color:var(--gold)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 14px}
.sugg span{font-size:13px;color:var(--muted)}
.sugg button{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.sugg button:active{transform:scale(.96)}
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.jump a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.jump a small{color:var(--gold);font-weight:700;margin-left:5px}

/* Fleisch */
.pref{padding:18px;display:grid;gap:16px}
.pref-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pref-h b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.pref-q{display:grid;gap:8px}
.pref-q>span{font-size:14px;font-weight:600;color:var(--ink)}
.pref-q small{font-size:13px;color:var(--muted)}
.segctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.segctl button{border:0;background:transparent;border-radius:10px;padding:11px 4px;font-size:14.5px;font-weight:600;color:var(--muted);line-height:1.2;transition:background-color .18s ease,color .18s ease,transform .16s var(--ease-out)}
.segctl button:active{transform:scale(.96)}
.segctl button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 14px -8px rgba(226,182,92,.8)}
.segctl[data-unset] button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-2);box-shadow:none}
.persons{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--panel-2);border-radius:999px;padding:6px 16px 6px 6px;font-weight:600;font-size:15.5px}
.person:active{transform:scale(.97)}
.person .av{width:32px;height:32px;font-size:15px}
.mates{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.mates b{color:var(--ink);font-weight:600}
.shop{padding:18px;display:grid;gap:14px}
.shop h3{font-size:26px;line-height:1.1}
.shop-grid{display:grid;grid-template-columns:1fr auto auto;gap:8px 18px;align-items:baseline;font-variant-numeric:tabular-nums}
.shop-grid .hd{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right}
.shop-grid .hd:first-child{text-align:left}
.shop-grid .l{font-weight:600;font-size:15.5px}
.shop-grid .l small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.shop-grid .v{text-align:right;font-weight:600;font-size:16px}
.shop-grid .rule{grid-column:1/-1;height:1px;background:var(--line2);margin:2px 0}
.shop-grid .sum.v{color:var(--gold-2);font-family:var(--display);font-size:26px;font-variant-numeric:lining-nums tabular-nums}
.shop .hint b{color:var(--ink)}

/* Gastgeber-Bereich */
.host{border:1px dashed var(--line2);border-radius:var(--r);background:transparent}
.host summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:10px;align-items:center;font-weight:600}
.host summary::-webkit-details-marker{display:none}
.host summary .ico{color:var(--gold)}
.host summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .2s var(--ease-out)}
.host[open] summary::after{transform:rotate(225deg)}
.host .in{padding:0 18px 18px;display:grid;gap:20px}
.field{display:grid;gap:6px}
.field>span{font-size:13.5px;font-weight:600}
.field small{color:var(--muted);font-size:13px}
.inp{width:100%;min-width:0;border:1px solid var(--line2);background:var(--panel-2);border-radius:12px;padding:11px 13px}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{resize:vertical;line-height:1.5}
.amounts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:14.5px}
.amounts b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.field>.hostsub{font-family:var(--display);font-size:22px;font-weight:600;margin-top:4px}

/* Leiste unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs nav{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,#0b201a 88%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line2);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 40px -14px rgba(0,0,0,.8)}
.tabs button{position:relative;display:grid;justify-items:center;gap:3px;border:0;background:transparent;border-radius:18px;padding:8px 2px 7px;font-size:11.5px;font-weight:600;color:var(--muted);transition:transform .16s var(--ease-out),background-color .2s ease,color .2s ease}
.tabs button:active{transform:scale(.94)}
.tabs button .ico{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--gold-soft)}
.tabs button[aria-current="page"] .ico{color:var(--gold)}
.tabs .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cran-fill);color:#fff;font-size:11px;line-height:18px;font-weight:700;box-shadow:0 0 0 2px var(--panel)}

/* Blatt von unten */
dialog.sheet{border:0;padding:0;margin:0;max-width:none;width:100%;max-height:none;background:transparent;color:var(--ink)}
dialog.sheet::backdrop{background:rgba(2,8,5,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog.sheet[open]{position:fixed;inset:auto 0 0 0;display:flex;justify-content:center}
.sh:focus{outline:none}
.sh .stick{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:16px -20px 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--panel) 22%);z-index:2}
.sh{position:relative;width:100%;overflow-x:hidden;max-width:560px;max-height:calc(100dvh - var(--sat) - 12px);overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.sh::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
@media (min-width:700px){dialog.sheet[open]{inset:0;align-items:center}.sh{border-radius:26px;border-bottom:1px solid var(--line2);max-height:86vh}.sh::before{display:none}}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open] .sh{animation:up .42s var(--ease-drawer)}@keyframes up{from{transform:translateY(100%)}}
  dialog.sheet[open]::backdrop{animation:fade .3s ease}@keyframes fade{from{opacity:0}}}
@media (prefers-reduced-motion:reduce){dialog.sheet[open] .sh{animation:fade .2s ease}}
.sh .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--panel-2);color:var(--muted);display:grid;place-items:center}
.sh .close:active{transform:scale(.92)}
.sh h2{font-size:30px;line-height:1.08;padding-right:40px;letter-spacing:-.015em}
.sh .lead{color:var(--muted);margin-top:6px;font-size:15px}
.sh .blk{display:grid;gap:10px;margin-top:22px}
.sh .blk>h4{margin:0;font-family:var(--display);font-style:italic;font-size:18px;color:var(--gold);font-weight:500}
.titleinp{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;border:1px solid transparent;background:transparent;border-radius:10px;padding:2px 6px;margin-left:-6px;width:calc(100% - 40px)}
.titleinp:focus{outline:none;border-color:var(--gold);background:var(--panel-2)}
.seg{display:grid;gap:8px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line2);background:var(--panel-2);border-radius:16px;padding:14px 16px;font-weight:600;font-size:16px;width:100%;transition:transform .16s var(--ease-out),border-color .15s ease,background-color .15s ease}
.opt:active{transform:scale(.98)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt .em{font-size:22px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,100%),1fr));gap:8px}
.tile{display:grid;gap:8px;justify-items:center;text-align:center;border:1px solid var(--line2);background:var(--panel-2);border-radius:16px;padding:16px 10px;font-weight:600;font-size:15px;line-height:1.25;transition:transform .16s var(--ease-out)}
.tile:active{transform:scale(.97)}
.tile[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;color:var(--on-gold);background:linear-gradient(145deg,var(--gold-2),#b98a35);flex:none}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.steps i{width:24px;height:4px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--gold)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line2);border-radius:14px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel-2);font-size:18px;line-height:1}
.stepper button:active{transform:scale(.92)}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.thread{display:grid;gap:10px}
.msg{background:var(--panel-2);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14.5px;position:relative}
.msg b{display:block;font-size:12.5px;color:var(--gold)}
.msg .x{position:absolute;top:4px;right:4px;border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:50%}
.msgform{display:flex;gap:8px}
.msgform input{flex:1;min-width:0}
.rztext{white-space:pre-wrap;font-size:15px;line-height:1.6;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.likers{font-size:13.5px;color:var(--muted)}
.danger{color:var(--cran);border-color:transparent;background:transparent;font-weight:600;padding:10px 0;border:0}
.center{text-align:center}
.hint{font-size:14px;color:var(--muted)}
.howto{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.howto li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.howto li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--linen);color:var(--linen-ink);padding:12px 16px;border-radius:16px;display:flex;gap:14px;align-items:center;font-size:14.5px;font-weight:500;max-width:calc(100% - 32px);z-index:60;box-shadow:0 14px 34px -10px rgba(0,0,0,.7)}
.toast button{background:transparent;border:0;color:var(--berry);font-weight:700}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .32s var(--ease-out)}@keyframes tin{from{transform:translate(-50%,14px);opacity:0}}
  .view{animation:vin .3s var(--ease-out)}@keyframes vin{from{opacity:0;transform:translateY(6px)}}}
.thanks{padding:24px 20px;text-align:center;display:grid;gap:8px;background:linear-gradient(160deg,var(--gold-soft),var(--panel))}
.thanks h2{font-size:30px}
.foot{text-align:center;display:grid;gap:4px;justify-items:center;padding-top:8px;color:var(--muted);font-size:14px}
.foot .tradition{font-family:var(--script);font-size:42px;line-height:1.05;color:var(--gold)}
@media (prefers-reduced-transparency:reduce){.tabs nav,.topbar{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Vorschau mit Beispieldaten. Nichts wird gespeichert, niemand bekommt eine Nachricht.</div>
<div class="topbar" id="topbar" aria-hidden="true"><div class="in"><b>Bei Andy, Mel &amp; Connor</b><span id="tb-days"></span></div></div>
<header class="hero" id="hero">
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <div class="wrap">
    <div class="card-frame">
      <svg class="orn top" width="22" height="18" viewBox="0 0 24 20" aria-hidden="true"><path fill="currentColor" d="M12 0l2.4 6.6L21 7.6l-5.2 4 1.9 6.9L12 14.6l-5.7 3.9 1.9-6.9-5.2-4 6.6-1z"/></svg>
      <p class="eyebrow" id="h-eyebrow">Heiligabend</p>
      <h1>Bei Andy, Mel &amp; Connor</h1>
      <p class="menu">Raclette, heißer Stein und Fondue, wie jedes Jahr</p>
      <div class="facts">
        <div class="fact"><b id="f-days">–</b><span id="f-days-l">Tage bis Heiligabend</span></div>
        <div class="fact"><b id="f-when">–</b><span id="f-when-l">Uhr</span></div>
        <div class="fact"><b id="f-pers">–</b><span>sind dabei</span></div>
      </div>
      <svg class="orn bot" width="40" height="14" viewBox="0 0 40 14" aria-hidden="true"><path d="M2 7h12M26 7h12" stroke="currentColor" stroke-width="1"/><circle cx="20" cy="7" r="3.2" fill="currentColor"/><circle cx="14.5" cy="7" r="1.3" fill="currentColor"/><circle cx="25.5" cy="7" r="1.3" fill="currentColor"/></svg>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="status" id="status" style="margin-top:18px">Einen Moment, die Liste wird geladen …</div>
  <main id="main" class="view"></main>
</div>

<div class="tabs"><nav id="tabs" aria-label="Bereiche"></nav></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sh" id="sh" tabindex="-1"></div></dialog>
<div id="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
/* ---------- Grundlagen ---------- */
const DEMO=new URLSearchParams(location.search).has('vorschau')||/\/vorschau\//.test(location.pathname);
const CFG=window.APP_CONFIG||{};
const ME_KEY=DEMO?'weihnachten-vorschau-ich':'weihnachten-ich-v2';
const STUMM=new URLSearchParams(location.search).has('stumm');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  sget(k){try{return sessionStorage.getItem(k)}catch(e){return null}},sset(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
function amount(t,u){if(u==='g')return t>=1000?fmt(Math.round(t/100)/10)+' kg':Math.round(t/50)*50+' g';if(u==='l')return fmt(Math.round(t*2)/2)+' l';return''}
const IC={
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  basket:'<path d="M3.5 10h17l-1.7 9.1a1.6 1.6 0 0 1-1.6 1.4H6.8a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M8 10l4-6 4 6M9.5 14v3M14.5 14v3"/>',
  people:'<circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c.8-3.6 3.2-5.6 6.4-5.6s5.6 2 6.4 5.6M15.8 4.8a3.2 3.2 0 0 1 0 6.2M17.8 14.6c1.9.7 3.1 2.6 3.6 5.4"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  chat:'<path d="M4.5 5.5h15v10h-8l-4.5 3.5v-3.5h-2.5z"/>',
  book:'<path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15h10"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  gift:'<path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13"/><path d="M12 7c-1.5-3-5-3.5-5-1.5S10 7 12 7zm0 0c1.5-3 5-3.5 5-1.5S14 7 12 7z"/>',
  wish:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="2.5"/>',
  dip:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/>',
  leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-4 6-7 10-9"/>',
  bread:'<path d="M4 13c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5v5H4z"/><path d="M9 10l-1.5 3M13 9.5l-1.5 3.5M17 10.5l-1.2 2.5"/>',
  cup:'<path d="M6 4h12l-1.5 15a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M6.5 9h11"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
  chev:'<path d="M9 5.5l6.5 6.5L9 18.5"/>',
  flame:'<path d="M12 21c-3.9 0-6.6-2.7-6.6-6.3 0-3.5 2.5-5.3 3.7-8.2.9 1.7 1.7 2.6 2.8 3.1.3-2.4 1.3-4.4 3-5.9.3 3.6 3.7 5.6 3.7 10.2C18.6 18 15.9 21 12 21z"/><path d="M12 21c-1.6 0-2.8-1.2-2.8-2.8 0-1.8 1.4-2.6 2-4 1.2 1 3.6 2.1 3.6 4 0 1.6-1.2 2.8-2.8 2.8z"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'
};
const ico=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const CATS=[
 {key:'wuensche',wish:true,icon:'wish',label:'Wünsche zum Fleisch',sub:'Fürs Pfännchen und zum Fondue',intro:'Was soll ins Pfännchen oder neben das Fleisch? Schreibt eure Wünsche auf, wir kümmern uns drum. Mit „Möchte ich auch“ seht ihr, was alle mögen.',ph:'Dein Wunsch …',sugg:['Zuckerschoten','Champignons','Kartöffelchen','Mais']},
 {key:'dips',icon:'dip',label:'Dips & Soßen',sub:'Ohne Soßen kein Fondue',intro:'Wer Lust hat, eine Soße zu machen: einfach eintragen. Gern mit Rezept, dann können’s andere nachmachen.',ph:'Soße oder Dip …',g:80,unit:'g',sugg:['Knoblauchsoße','Cocktailsoße','Currysoße','Kräuterquark']},
 {key:'salate',icon:'leaf',label:'Salate',sub:'Frisch zu Käse und Fleisch',intro:'Ein frischer Salat tut neben Käse und Fleisch richtig gut. Bring einfach mit, was du gern machst.',ph:'Welcher Salat?',g:100,unit:'g',sugg:['Grüner Salat','Gurkensalat','Krautsalat','Nudelsalat']},
 {key:'brot',icon:'bread',label:'Brot & Butter',sub:'Fladenbrot gehört dazu',intro:'Ohne Fladenbrot geht bei uns nix. Butter und Kräuterbutter sind auch immer gern gesehen.',ph:'Brot oder Butter …',g:100,unit:'g',sugg:['Fladenbrot','Baguette','Kräuterbutter']},
 {key:'getraenke',icon:'cup',label:'Getränke',sub:'Alles ohne Alkohol',intro:'Saft, Schorle, Punsch oder Wasser: Trag ein, was du mitbringst, sonst stehen am Ende fünf Flaschen Apfelschorle auf dem Tisch. 😄',ph:'Welches Getränk?',g:1.5,unit:'l',sugg:['Apfelschorle','Kinderpunsch','Orangensaft','Mineralwasser']}
];
const catOf=k=>CATS.find(c=>c.key===k);
const CHEESE_G=200;
/* Fleisch: 200 g pro Erwachsenem für den ganzen Abend (Stein und Fondue zusammen), Kinder halb.
   Jede Person sagt selbst, wie viel (wenig/normal/viel), welche Sorte und wofür. Wer nichts sagt, zählt als normal/beides/beides. */
const MEAT={base:200,menge:{wenig:.5,normal:1,viel:1.5},sorte:{rind:.7,beides:.5,schwein:.3},art:{stein:.8,beides:.6,fondue:.35}};
const MEAT_Q=[
  ['menge','Wie viel Fleisch?',[['wenig','Wenig'],['normal','Normal'],['viel','Viel']],''],
  ['sorte','Rind oder Schwein?',[['rind','Rind'],['beides','Beides'],['schwein','Schwein']],''],
  ['art','Heißer Stein oder Fondue?',[['stein','Stein'],['beides','Beides'],['fondue','Fondue']],'Auf den Stein kommt dünn geschnittenes Fleisch, ins Fondue gewürfeltes.']];
const MEAT_TXT={menge:{wenig:'isst wenig',normal:'isst normal',viel:'isst viel'},sorte:{rind:'lieber Rind',beides:'Rind und Schwein',schwein:'lieber Schwein'},art:{stein:'am liebsten Stein',beides:'Stein und Fondue',fondue:'am liebsten Fondue'}};
const nextYear=()=>{const d=new Date();return d.getFullYear()+(d.getMonth()===11&&d.getDate()>26?1:0)};
const afterParty=()=>{const d=new Date();return d.getMonth()===11&&d.getDate()>=25};

/* ---------- Zustand ---------- */
const TABS=['abend','fleisch','mitbringen','gaeste'];
const PERSON_KEY=DEMO?'weihnachten-vorschau-person':'weihnachten-person';
const data={info:{},gaeste:{},posten:{},antworten:{},fleisch:{}};
let mode='loading', sb=null, me=store.get(ME_KEY)||'', mePerson=store.get(PERSON_KEY)||'';
let tab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):'abend';
let sheet=null; // {t:'item'|'guest'|'welcome'|'push', id, step}
let editRecipe=false, hostOpen=false, justTaken=null, glowCard=false;
const chains={};

function list(col){return Object.entries(data[col]).map(([id,d])=>Object.assign({},d,{id})).sort((a,b)=>(a.t||0)-(b.t||0)||a.id.localeCompare(b.id))}
function guests(){return list('gaeste').map(g=>({...g,name:String(g.name||''),erw:+g.erw||0,kinder:+g.kinder||0,status:['ja','offen','nein'].includes(g.status)?g.status:'offen'}))}
function items(){return list('posten').filter(p=>catOf(p.kat)).map(p=>({...p,name:String(p.name||''),wer:String(p.wer||''),von:String(p.von||''),rezept:String(p.rezept||''),likes:Array.isArray(p.likes)?p.likes.map(String):[]}))}
const replies=pid=>list('antworten').filter(r=>r.posten===pid);
const gname=id=>(data.gaeste[id]&&data.gaeste[id].name)||'Jemand';
const short=id=>{const n=gname(id).replace(/\s*\(.*?\)\s*/g,' ').trim();return n||'Jemand'};
const isWish=p=>p.kat==='wuensche';
const ADMINS=['andreas','wir'];
const isAdmin=()=>ADMINS.includes(me);
const isPlural=id=>/&|\bund\b/.test(short(id));
const initials=n=>{const w=String(n).replace(/[^\p{L}\s&]/gu,'').split(/\s|&/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase()};
function counts(gs){const z=gs.filter(g=>g.status==='ja');const e=z.reduce((a,g)=>a+g.erw,0),k=z.reduce((a,g)=>a+g.kinder,0);return{e,k,n:e+k,p:e+k*.5,open:gs.filter(g=>g.status==='offen').length}}

/* ---------- Personen im Haushalt ----------
   Ein Gast-Eintrag ist ein Haushalt („Alex & Sarah“). Zusage, Anzahl und Mitbringsel gehören dem Haushalt,
   Anrede und Fleisch-Vorlieben der einzelnen Person. Die Personen kommen aus dem Namen; stimmt die Zahl
   mit Erwachsenen + Kindern überein, sind die letzten Namen die Kinder („Andy, Mel & Connor“: Connor). */
function people(g){
  if(!g)return[];
  const names=String(g.name||'').replace(/\s*\(.*?\)\s*/g,' ').split(/\s*(?:,|&|\bund\b)\s*/).map(n=>n.replace(/[^\p{L}\p{M}\s'.-]/gu,'').trim()).filter(Boolean);
  const cap=(+g.erw||0)+(+g.kinder||0), ns=cap&&names.length>cap?names.slice(0,cap):names, kids=ns.length===cap?(+g.kinder||0):0;
  return ns.map((n,i)=>({name:n,kid:i>=ns.length-kids}));
}
const meatId=(gid,person)=>gid+'~'+String(person).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-');
const prefOf=(gid,person)=>data.fleisch[meatId(gid,person)]||null;
function myPeople(){return people(data.gaeste[me])}
function myPerson(){const ps=myPeople();if(ps.length===1)return ps[0].name;return ps.some(p=>p.name===mePerson)?mePerson:''}
const needsPerson=()=>!!me&&myPeople().length>1&&!myPerson();
const myName=()=>myPerson()||short(me);
const canEditMeat=(gid,person)=>isAdmin()||(gid===me&&person===myPerson());
function meatCalc(gs){
  const st={r:0,s:0},fo={r:0,s:0};let chosen=0,total=0;
  const add=(f,art,sorte)=>{const g=MEAT.base*f,stein=g*MEAT.art[art],fond=g-stein,r=MEAT.sorte[sorte];st.r+=stein*r;st.s+=stein*(1-r);fo.r+=fond*r;fo.s+=fond*(1-r)};
  for(const g of gs.filter(g=>g.status==='ja')){
    const ps=people(g);
    for(const p of ps){total++;const pr=prefOf(g.id,p.name);if(pr)chosen++;add((MEAT.menge[pr&&pr.menge]||1)*(p.kid?.5:1),(pr&&MEAT.art[pr.art]!=null)?pr.art:'beides',(pr&&MEAT.sorte[pr.sorte]!=null)?pr.sorte:'beides')}
    const na=ps.filter(p=>!p.kid).length,nk=ps.length-na;
    for(let i=na;i<g.erw;i++){total++;add(1,'beides','beides')}
    for(let i=nk;i<g.kinder;i++){total++;add(.5,'beides','beides')}
  }
  return{st,fo,chosen,total,sum:st.r+st.s+fo.r+fo.s};
}
function setPref(gid,person,k,v){
  const old=prefOf(gid,person)||{menge:'normal',sorte:'beides',art:'beides'};
  write('fleisch',meatId(gid,person),{gast:gid,person,menge:old.menge,sorte:old.sorte,art:old.art,[k]:v,t:Date.now()});
}

/* ---------- Speichern ---------- */
function write(col,id,body){
  if(body===null)delete data[col][id]; else data[col][id]=Object.assign({},body,{id});
  render();
  if(mode!=='shared')return;
  const path=col+'/'+id,row=body===null?null:Object.assign({},body,{id});
  chains[path]=(chains[path]||Promise.resolve()).then(async()=>{
    const {error}=row===null?await sb.from(col).delete().eq('id',id):await sb.from(col).upsert(row);
    if(error)throw error;
  }).catch(e=>{console.error(e);toast('Hat gerade nicht geklappt. Check kurz dein Internet und versuch’s nochmal.')});
}
const setInfo=patch=>write('info','main',Object.assign({datum:'',fleisch:''},data.info.main||{},patch));
function notify(text){if(mode!=='shared'||!text||STUMM)return;sb.functions.invoke('notify',{body:{title:'Heiligabend bei Andy, Mel & Connor',body:text,actor:me||''}}).catch(()=>{})}
async function toggleLike(id){
  const p=data.posten[id];if(!p||!me)return;const l=(p.likes||[]).slice(),i=l.indexOf(me);i>=0?l.splice(i,1):l.push(me);
  data.posten[id]={...p,likes:l};render();
  if(mode!=='shared')return;
  const {error}=await sb.rpc('toggle_like',{p_id:id,g_id:me});if(error){console.error(error);toast('Das hat gerade nicht geklappt.')}
}
function take(id,on){
  const p=data.posten[id];if(!p)return;
  write('posten',id,{...p,wer:on?me:''});
  if(on){justTaken=id;render();toast(`Danke dir! ${p.name} steht jetzt bei dir.`);notify(`${short(me)} ${isPlural(me)?'bringen':'bringt'} ${p.name} mit. Danke! ✨`)}
  else{toast(`Kein Ding, ${p.name} ist wieder frei.`);notify(`${p.name} ist wieder frei. Wer mag es mitbringen?`)}
}
function setPerson(n){mePerson=n;store.set(PERSON_KEY,n)}
function setMe(id){if(id!==me)setPerson('');me=id;store.set(ME_KEY,id);if(pushState==='on'&&swReg)swReg.pushManager.getSubscription().then(s=>s&&saveSub(s)).catch(()=>{})}
function setStatus(id,st){
  const g=data.gaeste[id];if(!g||g.status===st)return;
  write('gaeste',id,{...g,status:st});
  const n=g.name.replace(/\s*\(.*?\)\s*/g,' ').trim();
  notify(st==='ja'?`${n} ${/&|und/.test(n)?'sind':'ist'} an Heiligabend dabei 🎄`:st==='nein'?`${n} ${/&|und/.test(n)?'können':'kann'} dieses Jahr leider nicht. Wir denken an euch.`:'');
}

/* ---------- Push & Installation ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOK='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
let pushState='checking', swReg=null, installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
function b64(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function saveSub(sub){if(!sb||DEMO)return;const j=sub.toJSON();const {error}=await sb.rpc('push_abo',{p_endpoint:j.endpoint,p_sub:j,p_gast:me||''});if(error)throw error}
async function initPush(){
  if(DEMO){pushState=isIOS&&!standalone?'ios-install':'off';render();return}
  if('serviceWorker' in navigator){try{swReg=await navigator.serviceWorker.register('sw.js')}catch(e){console.error(e)}}
  if(!pushOK||!swReg){pushState=isIOS&&!standalone?'ios-install':'unsupported';render();return}
  if(Notification.permission==='denied'){pushState='denied';render();return}
  try{const sub=await swReg.pushManager.getSubscription();pushState=sub?'on':'off';if(sub&&me)saveSub(sub).catch(()=>{})}catch(e){pushState='off'}
  render();
}
async function enablePush(){
  if(DEMO){toast('Vorschau: Benachrichtigungen wären jetzt an.');pushState='on';render();return true}
  pushState='busy';render();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';render();return false}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)});
    await saveSub(sub);pushState='on';toast('Benachrichtigungen sind an. Du bist auf Stand.');render();return true;
  }catch(e){console.error(e);pushState='off';toast('Hat nicht geklappt. Versuch’s gleich nochmal.');render();return false}
}
async function disablePush(){
  if(!DEMO){try{const sub=swReg&&await swReg.pushManager.getSubscription();if(sub){await sb.rpc('push_abmelden',{p_endpoint:sub.endpoint});await sub.unsubscribe()}}catch(e){console.error(e)}}
  pushState='off';toast('Benachrichtigungen sind aus.');render();
}

function itemRow(p,showCat){
  const rs=replies(p.id).length, k=catOf(p.kat), mine=me&&p.wer===me;
  const sub=[];
  if(showCat)sub.push(`<span class="catlbl">${esc(k.label)}</span>`);
  else if(p.von&&data.gaeste[p.von])sub.push(`<span>${isWish(p)?'Wunsch':'Idee'} von ${esc(short(p.von))}</span>`);
  if(!isWish(p)&&p.likes.length)sub.push(`<span>${ico('heart')} ${p.likes.length}</span>`);
  if(rs)sub.push(`<span>${ico('chat')} ${rs}</span>`);
  if(p.rezept)sub.push(`<span>${ico('book')} Rezept</span>`);
  let side;
  if(isWish(p)){const on=me&&p.likes.includes(me);side=`<button class="chip like" data-a="like" aria-pressed="${on}">${ico('heart')} ${on?'Ich auch':'Möchte ich auch'}${p.likes.length?' · '+p.likes.length:''}</button>`}
  else if(mine)side=`<button class="chip me${justTaken===p.id?' pop':''}" data-a="${isAdmin()?'assign':'open-item'}" aria-label="Du bringst ${esc(p.name)} mit. Antippen zum Ändern">${ico('check')} ${isPlural(me)?'Bringt ihr':'Bringst du'}</button>`;
  else if(p.wer)side=`<button class="chip ok" data-a="${isAdmin()?'assign':'open-item'}" title="${esc(short(p.wer))} bringt es mit" aria-label="${esc(short(p.wer))} bringt ${esc(p.name)} mit. Antippen zum Ändern">${ico('check')}<span class="nm">${esc(short(p.wer))}</span></button>`;
  else if(isAdmin())side=`<button class="chip take" data-a="assign">Wer bringt’s?</button>`;
  else side=`<button class="chip take" data-a="take">Bring ich mit</button>`;
  return `<div class="row" data-p="${esc(p.id)}"><button class="main" data-a="open-item" aria-label="${esc(p.name)} öffnen"><span class="t">${esc(p.name)}</span>${sub.length?`<span class="s">${sub.join('')}</span>`:''}</button>${side}</div>`;
}
function guestRow(g){
  const lbl={ja:/&|\bund\b/.test(g.name)?'Sind dabei':'Ist dabei',offen:'Noch offen',nein:'Dieses Jahr nicht'}[g.status];

}

function viewAbend(gs,its,c,info){
  let h='';
  const meG=me&&data.gaeste[me]?gs.find(g=>g.id===me):null;
  h+=placeCard(meG,its);

  /* Ein Wort von uns */
  h+=`<section class="panel word"><p>${info.fleisch?esc(info.fleisch):'Wie jedes Jahr gibt’s an Heiligabend Raclette, heißen Stein und Fondue. Ums Fleisch kümmern wir uns. Alles andere kann, muss aber nicht: Bringt einfach mit, worauf ihr Lust habt. Hauptsache, wir sitzen alle zusammen.'}</p><p class="sign">Andy, Mel &amp; Connor</p></section>`;
  if(afterParty()&&its.length)h+=`<section class="panel thanks"><h2>Was für ein schöner Abend ❤️</h2><p>Danke an alle, die gekocht, mitgebracht und mitgefeiert haben. Wir freuen uns schon aufs nächste Jahr.</p></section>`;

  /* Was noch fehlt */
  const open=its.filter(p=>!p.wer&&!isWish(p)), done=its.filter(p=>p.wer&&!isWish(p)).length, total=done+open.length;
  h+=`<section class="sec"><div class="sec-h"><span class="k">Die Tafel</span><h2>${!total?'Noch ist der Tisch leer':open.length?'Da freuen wir uns noch über Hilfe':'Alles ist vergeben'}</h2><p>${!total?'Magst du anfangen? Trag ein, was du mitbringen würdest, oder einfach eine Idee.':open.length?'Das hier hat noch keiner. Ein Tipp auf „Bring ich mit“ reicht.':'Klasse, danke euch! Neue Ideen gehen trotzdem immer.'}</p></div>`;
  if(total)h+=`<div class="panel progress"><div class="lbl"><span><b>${done} von ${total}</b> haben schon jemanden</span><span>${Math.round(done/total*100)} %</span></div><div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div></div>`;
  if(open.length)h+=`<div class="panel rows">${open.map(p=>itemRow(p,true)).join('')}</div>`;
  h+=`<div class="center"><button class="btn ghost" data-a="tab" data-v="mitbringen">${ico('basket')} Alles ansehen oder eigene Idee eintragen</button></div></section>`;

  if(isAdmin())h+=hostArea(gs,its,c,info);
  h+=`<footer class="foot"><p class="tradition">Frohe Weihnachten</p><p>Wir freuen uns auf einen schönen Abend mit euch!</p></footer>`;
  return h;
}

/* Deine Tischkarte: wer du bist und was bei dir noch offen ist. Ersetzt Begrüßung, drei Schritte und „Dein Beitrag“. */
let arrived=false;
function placeCard(meG,its){
  const cls='placecard'+(!arrived&&!store.sget('weihnachten-karte')?' arrive':'')+(glowCard?' glow':'');
  arrived=true;store.sset('weihnachten-karte','1');
  if(!meG)return `<section class="${cls}"><p class="pc-k">Heiligabend ${nextYear()}</p><p class="pc-name" style="font-size:clamp(34px,10vw,46px)">Dein Platz am Tisch</p><p class="pc-lead">Schön, dass du da bist! Sag uns kurz, wer du bist. Dann siehst du hier, was bei dir ansteht.</p><div class="pc-cta"><button class="btn" data-a="welcome">Los geht’s</button></div></section>`;
  const host=me==='andreas', many=isPlural(me), who=myName(), person=myPerson();
  const line=(done,icon,t,sub,act,v)=>`<button class="pc-line${done?' done':''}" data-a="${act}"${v?` data-v="${v}"`:''}><span class="n">${ico(done?'check':icon)}</span><span><b>${t}</b><small>${sub}</small></span><span class="go">${ico('chev')}</span></button>`;
  let L='';
  if(needsPerson())L+=line(false,'people','Wer von euch bist du?',`Tipp kurz an, ob du ${myPeople().map(p=>esc(p.name)).join(' oder ')} bist.`,'person-pick');
  if(!host){
    const st=meG.status;
    L+=line(st!=='offen','star',st==='ja'?(many?'Ihr seid dabei':'Du bist dabei'):st==='nein'?'Dieses Jahr nicht':(many?'Seid ihr dabei?':'Bist du dabei?'),
      st==='ja'?`${meG.erw+meG.kinder} ${meG.erw+meG.kinder===1?'Platz':'Plätze'} am Tisch. Wir freuen uns!`:st==='nein'?'Schade! Wenn sich was ändert, sag einfach Bescheid.':'Ja, nein oder weiß noch nicht, alles okay.','welcome-kommst');
  }
  if(person&&(host||meG.status==='ja')){const pr=prefOf(me,person);
    L+=line(!!pr,'flame',pr?'Dein Fleisch':'Wie magst du dein Fleisch?',pr?`${MEAT_TXT.menge[pr.menge]}, ${MEAT_TXT.sorte[pr.sorte]}, ${MEAT_TXT.art[pr.art]}`:'Zehn Sekunden, damit wir genau richtig einkaufen.','tab','fleisch')}
  if(!host&&meG.status!=='nein'){const mine=its.filter(p=>p.wer===me&&!isWish(p));
    L+=line(mine.length>0,'basket',mine.length?(many?'Ihr bringt mit':'Du bringst mit'):'Magst du was mitbringen?',mine.length?mine.map(p=>esc(p.name)).join(', '):'Salat, Soße, Brot, Getränke oder was ganz Eigenes.','tab','mitbringen')}
  if(host)L+=line(true,'star','Ihr seid die Gastgeber','Unten findet ihr euren Bereich, im Fleisch-Tab den Einkaufszettel.','tab','fleisch');
  if(pushState==='off'||pushState==='ios-install')L+=line(false,'bell','Auf Stand bleiben','Nur wenn sich am Plan was ändert. Kein Spam.','guide-push');
  return `<section class="${cls}"><p class="pc-k">Heiligabend ${nextYear()}, ${person||!many?'dein':'euer'} Platz</p><p class="pc-name">${esc(who)}</p><div class="pc-lines">${L}</div>
    ${pushState==='on'?`<p class="hint center" style="color:var(--linen-muted);margin-top:8px">Benachrichtigungen sind an. <button class="link" style="color:var(--berry)" data-a="push-off">Ausschalten</button></p>`:''}</section>`;
}

function catPanel(k,its,gs){
  const all=its.filter(p=>p.kat===k.key);
  if(k.wish)all.sort((a,b)=>b.likes.length-a.likes.length||(a.t||0)-(b.t||0));
  let h=`<section class="panel" id="k-${k.key}" style="scroll-margin-top:calc(var(--sat) + 64px)"><div class="cat-h"><span class="em">${ico(k.icon)}</span><div><h3>${esc(k.label)}</h3><div class="sub">${esc(k.sub)}</div></div></div><p class="cat-intro">${esc(k.intro)}</p>
    <div class="rows" style="border-top:1px solid var(--line)">${all.length?all.map(p=>itemRow(p,false)).join(''):`<div class="empty">Noch leer. Magst du anfangen?</div>`}</div>

function paint(el,html){
  const a=document.activeElement, keep=a&&a.id&&el.contains(a)?{id:a.id,v:a.value,s:'selectionStart' in a?[a.selectionStart,a.selectionEnd]:null}:null;
  const drafts=[...el.querySelectorAll('form input[id], form textarea[id], form select[id]')].filter(i=>i.type!=='checkbox'&&i.value).map(i=>[i.id,i.value]);
  const checks=[...el.querySelectorAll('form input[type=checkbox]')].map(i=>[i.id,i.checked]);
  const st=el.scrollTop;
  el.innerHTML=html;
  for(const [id,v] of drafts){const n=document.getElementById(id);if(n)n.value=v}
  for(const [id,v] of checks){const n=document.getElementById(id);if(n)n.checked=v}
  el.scrollTop=st;
  if(keep){const n=document.getElementById(keep.id);if(n){if(n.tagName==='TEXTAREA'||(n.tagName==='INPUT'&&n.type!=='checkbox'))n.value=keep.v;n.focus({preventScroll:true});if(keep.s&&n.setSelectionRange)try{n.setSelectionRange(keep.s[0],keep.s[1])}catch(e){}}}
}

}

async function resetYear(form){
  const ny=nextYear(),v=form.querySelector('input').value.trim();
  if(v!==String(ny)){toast(`Bitte genau ${ny} eingeben, dann wird die Liste zurückgesetzt.`);return}
  if(mode==='shared'){const {error}=await sb.rpc('neues_jahr');if(error){console.error(error);toast('Das Zurücksetzen hat nicht geklappt. Bitte noch einmal versuchen.');return}}
  hostOpen=false;data.posten={};data.antworten={};for(const id in data.gaeste)data.gaeste[id]={...data.gaeste[id],status:'offen'};data.info.main={...(data.info.main||{}),datum:'',fleisch:''};
  render();scrollTo({top:0,behavior:'smooth'});toast(`Die Liste für Weihnachten ${ny} ist bereit.`);
  notify(`Weihnachten ${ny} rückt näher! Die Liste ist bereit. Wir freuen uns auf euch.`);

let toastT;
function toast(msg,withUndo){
  const r=$('#toast-root');clearTimeout(toastT);
  r.innerHTML=`<div class="toast" role="status"><span></span>${withUndo?'<button type="button">Rückgängig</button>':''}</div>`;
  r.querySelector('span').textContent=msg;
  const u=r.querySelector('button');if(u)u.onclick=()=>{if(undo){write(undo[0],undo[1],undo[2]);undo=null}r.innerHTML=''};
  toastT=setTimeout(()=>{r.innerHTML=''},4500);
}

/* ---------- Lichter & Schnee (nur im Kopf) ---------- */
(function(){
  const L=$('#lights');const fill=()=>{const n=Math.max(10,Math.min(36,Math.round(L.clientWidth/34)));if(L.childElementCount!==n)L.innerHTML='<i class="bulb"></i>'.repeat(n)};fill();addEventListener('resize',fill);
  const cv=$('#snow'),ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,fl=[],raf=0;
  function size(){const d=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    fl=Array.from({length:Math.min(60,Math.round(W*H/6000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,s:.15+Math.random()*.35,w:Math.random()*6.28}));draw()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';for(const f of fl){ctx.globalAlpha=.25+f.r/4;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}ctx.globalAlpha=1}
  function tick(){for(const f of fl){f.y+=f.s;f.w+=.01;f.x+=Math.sin(f.w)*.25;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}}draw();raf=requestAnimationFrame(tick)}
  size();addEventListener('resize',size);new ResizeObserver(size).observe($('#hero'));
  if(!still){raf=requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(tick)})}
})();

/* ---------- Start ---------- */
(async function(){
  initPush();
  if(DEMO){$('#demo').hidden=false;demoData();mode='demo';$('#status').hidden=true;render();if(!me||new URLSearchParams(location.search).has('neu')){me='';openSheet({t:'welcome',step:'wer'})}return}
  if(!window.supabase||!CFG.url){$('#status').textContent='Die App ist gerade nicht erreichbar. Bitte lade die Seite neu.';$('#status').dataset.kind='warn';return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  async function load(){const cols=['info','gaeste','posten','antworten'];const [rs,fl]=await Promise.all([Promise.all(cols.map(c=>sb.from(c).select('*'))),sb.from('fleisch').select('*')]);rs.forEach(r=>{if(r.error)throw r.error});cols.forEach((c,i)=>{data[c]=Object.fromEntries(rs[i].data.map(r=>[r.id,r]))});
    if(fl.error)console.warn('Tabelle fleisch fehlt noch',fl.error);else data.fleisch=Object.fromEntries(fl.data.map(r=>[r.id,r]))}
  try{await load();mode='shared';$('#status').hidden=true;render()}
  catch(e){console.error(e);$('#status').textContent='Die Liste ist gerade nicht erreichbar. Prüf kurz das Internet und lade die Seite neu.';$('#status').dataset.kind='warn';return}
  if(!me&&!store.sget('weihnachten-umschauen')){store.sset('weihnachten-umschauen','1');openSheet({t:'welcome',step:'wer'})}
  sb.channel('weihnachten').on('postgres_changes',{event:'*',schema:'public'},pl=>{
    const col=pl.table;if(!(col in data))return;
    if(pl.eventType==='DELETE'){if(pl.old&&pl.old.id)delete data[col][pl.old.id]}else data[col][pl.new.id]=pl.new;
    render();
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='shared')load().then(render).catch(()=>{})});
})();
})();
