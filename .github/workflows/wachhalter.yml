# Hält die kostenlose Supabase-Datenbank wach (sie pausiert sonst nach 7 Tagen ohne Nutzung)
# und macht einmal im Monat einen kleinen Commit, damit GitHub den Zeitplan nicht abschaltet.
name: Wachhalter
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anpingen
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" config.js)
          curl -sf -H "apikey: $KEY" "$URL/rest/v1/info?select=id&limit=1" > /dev/null
      - name: Monatlicher Lebenszeichen-Commit
        if: github.event_name == 'workflow_dispatch' || startsWith(format('{0}', github.event.schedule), '17 6')
        run: |
          M=$(date -u +%Y-%m)
          if [ "$(cat .lebenszeichen 2>/dev/null)" != "$M" ]; then
            echo "$M" > .lebenszeichen
            git config user.name "wachhalter"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .lebenszeichen && git commit -m "Lebenszeichen $M" && git push
          fi
